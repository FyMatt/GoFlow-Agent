      workflow: security-audit-evidence-gate
      agent: security-researcher
vertical_pack:
    domain: security-research
    maturity: production-ready
    summary: 规划已授权安全审查，收集代码、Web、二进制和配置证据，裁定可利用性，阻止越权动作，并让发现通过红队、蓝队、风险和质量门禁。
    supported_tasks:
        - authorized security review planning
        - evidence collection
        - vulnerability classification
        - authorized red-team validation
        - attack-path and exploitability validation planning
        - disclosure-safe security reporting
        - remediation planning
        - cross-domain security handoff
    required_inputs:
        - authorized scope
        - target type
        - target files or URL
        - allowed actions
        - red-team authorization, exclusions, and rate limits
        - reporting expectations
    tool_boundaries:
        - Use read-only evidence collection before any active verification.
        - Web browser automation requires allowed hosts and authorized scope; active web canary probes require explicit approval.
        - Offensive validation must stay non-destructive, scoped, rate-limited, and evidence-oriented.
        - Binary analysis remains static and uses format, entropy, symbol, and bounded artifact helpers unless a separate sandboxed execution tool is added.
        - Redaction checks must run before customer-visible or disclosure-safe reporting when evidence may contain secrets.
    safety_gates:
        - Require scope confirmation.
        - Require approval for active verification or exec-capable tools.
        - Block unsanctioned exploitation, credential attacks, persistence, destructive changes, denial of service, and lateral movement.
        - Separate confirmed vulnerabilities from hypotheses.
        - Preserve authorization blockers, missing evidence, and weak exploitability confidence as visible workflow diagnostics.
    quality_gates:
        - Requires evidence-backed severity.
        - Requires exploitability prerequisites.
        - Requires remediation and follow-up tests.
        - Requires disclosure-safe wording and red/blue handoff evidence before final reporting.
    evidence_artifacts:
        - scope note
        - evidence inventory
        - finding list
        - authorized red-team validation plan
        - red-team evidence and blocked-action log
        - risk decision
        - disclosure-safe report
        - remediation report
    presentation_guidance:
        - Show scope, target type, allowed actions, evidence status, and risk summary.
        - Show whether offensive validation is authorized, blocked, or complete.
        - Show tool allowlists, approval decisions, evidence refs, severity policy, and route diagnostics.
        - Show red-team scope, exclusions, allowed payload classes, rate limits, and blue-team handoff refs.
        - Show authorization blockers, disallowed actions, weak evidence, unresolved exploitability, and disclosure-safe report checks.
    token_strategy:
        - Route each surface to a bounded specialist workflow.
        - Pass concise evidence summaries to the final risk report.
    model_routes:
        strong:
            - scope triage
            - exploitability arbitration
            - red-team authorization boundary review
            - final report synthesis
        worker:
            - code evidence collection
            - web evidence collection
            - authorized non-destructive validation
            - static binary triage
        verifier:
            - severity and evidence review
acceptance:
  sample_request: 在授权范围内修复默认拒绝、路径越界、请求头注入和令牌脱敏四项缺陷并复测。
  verify_commands: [go test ./..., go vet ./...]
  deliverables: [deliverables/security-report.md]
  min_quality_score: 80

metadata:
