examples:
    - title: Authorized review
      description: Create a scoped evidence-backed security review.
      request: Create an authorized security review plan and identify evidence requirements.
      workflow: skill-chain
      agent: security-researcher
    - title: Evidence-gated review
      description: Collect scoped evidence, audit risk, and route findings through a quality gate.
      request: Review this authorized target and produce an evidence-backed remediation report.
      workflow: security-audit-evidence-gate
      agent: security-researcher
vertical_pack:
    domain: security-research
    maturity: guided
    summary: Plans authorized security reviews, collects evidence across code, web, and binary surfaces, and routes findings through risk and quality gates.
    supported_tasks:
        - authorized security review planning
        - evidence collection
        - vulnerability classification
        - remediation planning
        - cross-domain security handoff
    required_inputs:
        - authorized scope
        - target type
        - target files or URL
        - allowed actions
        - reporting expectations
    tool_boundaries:
        - Use read-only evidence collection before any active verification.
        - Web browser automation requires allowed hosts and authorized scope; active web canary probes require explicit approval.
        - Binary analysis remains static unless a separate sandboxed execution tool is added.
    safety_gates:
        - Require scope confirmation.
        - Require approval for active verification or exec-capable tools.
        - Separate confirmed vulnerabilities from hypotheses.
    quality_gates:
        - Requires evidence-backed severity.
        - Requires exploitability prerequisites.
        - Requires remediation and follow-up tests.
    evidence_artifacts:
        - scope note
        - evidence inventory
        - finding list
        - risk decision
        - remediation report
    simple_mode:
        - Show scope, target type, allowed actions, evidence status, and risk summary.
    expert_mode:
        - Show tool allowlists, approval decisions, evidence refs, severity policy, and route diagnostics.
    token_strategy:
        - Route each surface to a bounded specialist workflow.
        - Pass concise evidence summaries to the final risk report.
    model_routes:
        strong:
            - scope triage
            - exploitability arbitration
            - final report synthesis
        worker:
            - code evidence collection
            - web evidence collection
            - static binary triage
        verifier:
            - severity and evidence review
metadata:
    preset: security-research
    recommended_agent: security-researcher
    recommended_workflow: human-input-security-review
    scaffold_preset: security-research
    recommended_team: audit-security-team
    primary_skill: vulnerability-research
