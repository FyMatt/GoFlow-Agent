description: Triage user issues, gather factual context, draft customer-ready replies, and flag escalation or privacy risk.
category: support
tags:
    - support
    - triage
    - customer-response
    - escalation
agents:
    - support-specialist
    - chat
    - planner
    - auditor
providers:
    - primary
skills:
    - execution-plan
    - code-audit
tools:
    - file_tools/read_file
    - file_tools/search_files
    - web_tools/web_search
workflows:
    - skill-chain
workflow_templates:
    - customer-support-triage
    - parallel-research-review
team_templates:
