examples:
    - title: 改进现有项目
      description: 在审批约束下规划、修改并审查代码改动。
      request: 优化这个项目，并补充聚焦测试。
      workflow: plan-fix-audit
      agent: software-engineer
    - title: 通过质量门禁的改动
      description: 产出计划、实现、验证证据、审计结果和最终交付说明。
      request: 实现所需功能，并在最终答复前通过质量门禁。
      workflow: software-quality-gate
      agent: software-engineer
vertical_pack:
    domain: software-engineering
    maturity: production-ready
    summary: 使用工作区文件工具、受限上下文、审批感知写入、产物优先证据和质量门禁，完成软件改动的规划、拆解、实现、验证、审计与交付。
    supported_tasks:
        - scoped implementation
        - bug fixing
        - refactoring
        - test and verification planning
        - parallel bounded worker delivery
        - code review handoff
    required_inputs:
        - user requirement
        - target files or project area
        - acceptance criteria
        - verification command preference
        - risk tolerance for writes
        - confirmed workspace boundary
    tool_boundaries:
        - Read tools are used for discovery before edits.
        - Write tools require fix-stage scope and approval policy.
        - Exec verification should stay focused and report exact commands.
        - File tools stay inside the confirmed workspace and reject outside-workspace paths.
    safety_gates:
        - Request approval before broad rewrites or risky writes.
        - Keep changes inside the confirmed workspace.
        - Preserve verification failures and unresolved risks for review.
        - Use worker ownership boundaries before parallel writes.
    quality_gates:
        - Requires implementation summary.
        - Requires verification evidence or a stated blocker.
        - Requires audit findings or clean review rationale.
        - Requires artifact refs or compact evidence for worker outputs.
    evidence_artifacts:
        - implementation plan
        - changed file summary
        - verification output
        - audit report
        - worker artifact refs
        - final handoff
    presentation_guidance:
        - Show task, target area, approval prompts, verification result, and final handoff.
        - Hide raw context budgets and route internals by default.
        - Show workflow graph, stage models, allowed tools, context budgets, artifact refs, and retry state.
    token_strategy:
        - Use file summaries and hashes before full file reads.
        - Pass compact stage outputs and artifact refs between stages.
        - Route complex changes through complex-project-delivery for one approval and parallel test, build, and lint verification.
        - Use artifact refs, changed-file summaries, and verification summaries instead of copying worker transcripts.
    model_routes:
        strong:
            - task decomposition
            - architecture tradeoff review
            - conflict resolution
            - final audit synthesis
        worker:
            - bounded code edits
            - focused tests
            - local refactors
        verifier:
            - regression review
            - quality gate evaluation
acceptance:
  sample_request: 在这个 Go 仓库中完成配置 v2 迁移与并发安全 TTL 缓存，补充公开测试和升级说明。
  verify_commands: [go test ./... -count=2, go vet ./..., gofmt -l .]
  deliverables: [docs/upgrade.md]
  min_quality_score: 80

metadata:
    preset: software-engineering
    recommended_agent: software-engineer
    recommended_workflow: plan-fix-audit
    scaffold_preset: software-engineering
    recommended_team: software-task-team
    primary_skill: code-writing
