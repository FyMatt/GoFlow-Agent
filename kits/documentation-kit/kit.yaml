kind: goflow.kit
version: 1
min_supported_version: 1
name: documentation-kit
title: Documentation Kit
description: Plan, update, review, and hand off technical documentation changes.
category: documentation
tags:
    - docs
    - writing
    - review
agents:
    - chat
    - planner
    - fixer
    - auditor
    - documentation-specialist
providers:
    - primary
skills:
    - execution-plan
    - code-writing
    - code-audit
tools:
    - file_tools/read_file
    - file_tools/search_files
    - file_tools/write_file
workflows:
    - plan-fix-audit
workflow_templates:
    - docs-review-publish
team_templates:
    - documentation-team
policy_rules:
    - expression
    - team_approval_gate
examples:
    - title: Refresh docs
      description: Update docs and review for accuracy.
      request: Update the setup documentation and verify commands are accurate.
      workflow: docs-review-publish
      agent: documentation-specialist
    - title: Publish-ready handoff
      description: Draft documentation changes and route them through review before publishing.
      request: Rewrite the operator guide and produce a publish checklist.
      workflow: docs-review-publish
      agent: documentation-specialist
vertical_pack:
    domain: documentation
    maturity: guided
    summary: Plans, edits, reviews, and prepares publish-ready technical documentation with accuracy and verification checks.
    supported_tasks:
        - documentation planning
        - guide updates
        - command verification notes
        - publish checklist creation
    required_inputs:
        - target document
        - audience
        - desired change
        - verification expectations
    tool_boundaries:
        - Read existing docs before edits.
        - Write only scoped documentation files.
        - Run commands only when verification is needed and approved.
    safety_gates:
        - Preserve existing bilingual conventions.
        - Do not invent commands or behavior without source evidence.
    quality_gates:
        - Requires changed document summary.
        - Requires accuracy review.
        - Requires publish checklist or residual gaps.
    evidence_artifacts:
        - documentation plan
        - changed file summary
        - verification notes
        - publish checklist
    simple_mode:
        - Show document target, audience, status, and publish readiness.
    expert_mode:
        - Show raw diffs, validation commands, style constraints, and artifact refs.
    token_strategy:
        - Use document summaries before full reads.
        - Pass section-level summaries into review.
    model_routes:
        strong:
            - structure planning
            - final accuracy review
        worker:
            - scoped doc edits
            - checklist drafting
        verifier:
            - command and link review
metadata:
    preset: documentation
    recommended_agent: documentation-specialist
    recommended_workflow: docs-review-publish
    scaffold_preset: documentation
    recommended_team: documentation-team
    primary_skill: code-writing
