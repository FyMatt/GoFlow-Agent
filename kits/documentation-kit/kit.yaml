kind: goflow.kit
version: 1
min_supported_version: 1
name: documentation-kit
title: Documentation Kit
description: Plan, update, review, and hand off technical documentation changes.
category: documentation
tags:
    - docs
    - writing
    - review
agents:
    - chat
    - planner
    - fixer
    - auditor
    - documentation-specialist
providers:
    - primary
skills:
    - execution-plan
    - code-writing
    - code-audit
tools:
    - file_tools/read_file
    - file_tools/search_files
    - file_tools/write_file
workflows:
    - plan-fix-audit
workflow_templates:
    - docs-review-publish
team_templates:
    - documentation-team
policy_rules:
    - expression
    - team_approval_gate
examples:
    - title: Refresh docs
      description: Update docs and review for accuracy.
      request: Update the setup documentation and verify commands are accurate.
      workflow: docs-review-publish
      agent: documentation-specialist
    - title: Publish-ready handoff
      description: Draft documentation changes and route them through review before publishing.
      request: Rewrite the operator guide and produce a publish checklist.
      workflow: docs-review-publish
      agent: documentation-specialist
metadata:
    preset: documentation
    recommended_agent: documentation-specialist
    recommended_workflow: docs-review-publish
    scaffold_preset: documentation
    recommended_team: documentation-team
    primary_skill: code-writing
