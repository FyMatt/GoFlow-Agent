vertical_pack:
    domain: multi-domain
    maturity: production-ready
    summary: 通过结构化接收、分支选择契约、并行上限、分支工具白名单、成本归属、领域执行器、产物优先汇总、冲突检测、审计和质量门禁处理混合任务并交付整合风险报告。
    supported_tasks:
        - domain routing
        - task intake
        - task decomposition
        - selected parallel domain execution
        - branch-selection diagnostics
        - max-parallel orchestration
        - per-branch tool allowlist enforcement
        - authorized red-team validation routing
        - team handoff
        - starter kit selection
        - artifact handoff and conflict detection
        - multi-domain report synthesis
    required_inputs:
        - primary domain or auto routing
        - user goal
        - target context
        - desired output
        - risk tolerance
        - maximum parallel domains
        - branch selection policy
    tool_boundaries:
        - Uses only selected domain worker tools and linked team template refs.
        - Unselected domain workers do not run, reducing token and tool exposure.
        - Each selected branch must carry branch-selection reason, per-branch tool allowlist, budget/cost attribution, and artifact handoff contract.
        - Keeps decomposition, worker handoffs, join, audit, and synthesis summary-first.
        - Network-device work is routed to operations tools with authorized scope, host allowlists, dry-run plans, and evidence refs.
        - Offensive security work is routed to authorized red-team validation with written scope, allowlists, approvals, rate limits, and blocked-action reporting.
    safety_gates:
        - Route risky domains to approval-aware workflows.
        - Require explicit authorization and scope for security, web, operations, and binary analysis work.
        - Keep offensive validation non-destructive, scoped, and approval-gated.
        - Block joins when selected worker artifacts are missing or cross-domain conflicts are unresolved.
        - Preserve unresolved decisions for operator review.
    quality_gates:
        - Requires decomposition with selected active branches.
        - Requires branch-selection reason, pruned branch list, max-parallel decision, and per-branch allowlist.
        - Requires selected worker summaries or explicit blockers.
        - Requires artifact handoff, join conflict diagnostics, integrated report, audit decision, token/cost discipline, and risk handoff.
    evidence_artifacts:
        - intake summary
        - multi-domain task graph
        - branch-selection reason
        - pruned branches
        - per-branch tool allowlists
        - selected domain worker reports
        - authorized red-team validation report
        - integrated multi-domain report
        - join conflict report
        - audit report
        - final handoff report
    presentation_guidance:
        - Show goal, target, desired output, risk tolerance, selected/pruned domains, branch blockers, approvals, quality status, join conflicts, and final handoff.
        - Show active_branches, branch_selection_reason, pruned_branches, per_branch_tool_allowlists, branch contracts, team template refs, policy refs, model routes, context budgets, cost attribution, artifacts, conflicts, and audit evidence.
    token_strategy:
        - Route with compact intake fields.
        - Use strong-model decomposition once, then run only selected domain workers.
        - Pass branch contracts, summaries, structured fields, and artifact refs instead of full transcripts.
        - Keep unselected branches out of execution, join, audit, and final handoff.
        - Attribute cost by selected branch and surface budget blockers instead of truncating work.
    model_routes:
        strong:
            - task decomposition
            - selected branch arbitration
            - cross-domain aggregation
            - final audit synthesis
        worker:
            - selected domain worker execution
            - bounded domain analysis
        verifier:
            - quality gate review
acceptance:
  sample_request: 按需选择代码、安全、部署和文档分支，完成统一验证后写出统一交付报告。
  verify_commands: [go test ./..., go vet ./...]
  deliverables: [docs/unified-delivery.md]
  min_quality_score: 80

