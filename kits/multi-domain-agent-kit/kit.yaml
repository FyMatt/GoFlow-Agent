vertical_pack:
    domain: multi-domain
    maturity: guided
    summary: Routes mixed user requests through structured intake, strong-model task decomposition, selected parallel domain workers, artifact-first join, audit, quality gate, and final report.
    supported_tasks:
        - domain routing
        - task intake
        - task decomposition
        - selected parallel domain execution
        - team handoff
        - starter kit selection
        - multi-domain report synthesis
    required_inputs:
        - primary domain or auto routing
        - user goal
        - target context
        - desired output
        - risk tolerance
        - maximum parallel domains
    tool_boundaries:
        - Uses only selected domain worker tools and linked team template refs.
        - Unselected domain workers do not run, reducing token and tool exposure.
        - Keeps decomposition, worker handoffs, join, audit, and synthesis summary-first.
        - Network-device work is routed to operations tools with authorized scope, host allowlists, dry-run plans, and evidence refs.
    safety_gates:
        - Route risky domains to approval-aware workflows.
        - Require explicit authorization and scope for security, web, operations, and binary analysis work.
        - Preserve unresolved decisions for operator review.
    quality_gates:
        - Requires decomposition with selected active branches.
        - Requires selected worker summaries or explicit blockers.
        - Requires integrated report, audit decision, token discipline, and risk handoff.
    evidence_artifacts:
        - intake summary
        - multi-domain task graph
        - selected domain worker reports
        - integrated multi-domain report
        - audit report
        - final handoff report
    simple_mode:
        - Show goal, target, desired output, risk tolerance, selected domains, approvals, quality status, and final handoff.
    expert_mode:
        - Show active_branches, branch contracts, team template refs, policy refs, model routes, context budgets, artifacts, and audit evidence.
    token_strategy:
        - Route with compact intake fields.
        - Use strong-model decomposition once, then run only selected domain workers.
        - Pass branch contracts, summaries, structured fields, and artifact refs instead of full transcripts.
        - Keep unselected branches out of execution, join, audit, and final handoff.
    model_routes:
        strong:
            - task decomposition
            - selected branch arbitration
            - cross-domain aggregation
            - final audit synthesis
        worker:
            - selected domain worker execution
            - bounded domain analysis
        verifier:
            - quality gate review
metadata:
    preset: multi-domain-agent
    recommended_agent: chat
