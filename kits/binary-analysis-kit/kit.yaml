workflow_templates:
    - binary-triage
team_templates:
    - binary-triage-team
policy_rules:
    - risk_at_least
    - team_approval_gate
examples:
    - title: Triage a binary artifact
      description: Inspect metadata, strings, and suspicious offsets before producing an evidence-backed report.
      request: Analyze sample.bin for risky imports, protocol strings, packed sections, and likely vulnerability surfaces.
      workflow: skill-chain
      agent: binary-analyst
    - title: Defensive binary workflow
      description: Plan static analysis, collect evidence, branch on risk, and report next reversing actions.
      request: Run static binary triage on sample.bin without executing it.
      workflow: binary-triage
      agent: binary-analyst
vertical_pack:
    domain: binary-analysis
    maturity: production-ready
    summary: Performs static binary and reverse-engineering triage using metadata, format/section summary, imports/exports, entropy/packing hints, symbol/function clues, bounded artifact extraction, and defensive vulnerability reasoning.
    supported_tasks:
        - static binary metadata review
        - format/section summary
        - import/export summary
        - entropy/packing hints
        - symbol/function index when available
        - printable string triage
        - suspicious indicator extraction
        - bounded artifact extraction
        - reverse-analysis note generation
        - follow-up vulnerability hypothesis report
    required_inputs:
        - binary path
        - analysis objective
        - allowed analysis depth
        - target platform when known
    tool_boundaries:
        - Do not execute untrusted binaries.
        - Use bounded metadata, format summary, entropy map, symbol hints, strings, hex previews, and artifact windows.
        - Treat deeper disassembly/debugging as a separate sandboxed execution boundary.
    safety_gates:
        - Keep analysis static by default.
        - Require operator approval before any future execution-capable workflow.
        - Block unsafe dynamic analysis unless a sandbox plan, approval, and artifact isolation are present.
    quality_gates:
        - Requires file metadata.
        - Requires format/section summary.
        - Requires entropy/packing assessment.
        - Requires evidence for suspicious indicators.
        - Requires offset/string references, confidence, next reversing steps, and unsafe-action blockers.
    evidence_artifacts:
        - binary metadata
        - format summary
        - entropy map
        - import/export hints
        - string indicators
        - hex evidence
        - bounded artifact window
        - reverse notes
        - risk report
    simple_mode:
        - Show file path, format, entropy/packing status, suspicious indicators, offset refs, blockers, and next steps.
    expert_mode:
        - Show offsets, imports/exports, symbol hints, entropy blocks, tool outputs, artifact refs, static-analysis limits, and sandbox gaps.
    token_strategy:
        - Return bounded strings and hex snippets instead of full binary content.
        - Keep raw binary data out of prompts.
    model_routes:
        strong:
            - risk interpretation
            - reverse-analysis synthesis
        worker:
            - metadata extraction
            - format and section summary
            - entropy and packing review
            - symbol and string extraction
            - bounded artifact extraction
        verifier:
            - static evidence review
metadata:
    preset: binary-analysis
    recommended_agent: binary-analyst
    recommended_workflow: binary-triage
    scaffold_preset: binary-analysis
    recommended_team: binary-triage-team
    primary_skill: binary-vulnerability-research
