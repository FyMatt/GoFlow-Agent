kind: goflow.kit
version: 1
min_supported_version: 1
name: binary-analysis-kit
title: Binary Analysis Kit
description: Triage binary artifacts with built-in Python metadata, strings, hex preview, reverse-engineering, and vulnerability-research skills.
category: security
tags:
    - binary
    - reverse-engineering
    - security
agents:
    - binary-analyst
    - security-researcher
    - auditor
providers:
    - primary
skills:
    - binary-vulnerability-research
    - reverse-engineering
    - vulnerability-research
tools:
    - python_notes/binary_file_info
    - python_notes/binary_strings
    - python_notes/hex_preview
workflows:
    - skill-chain
workflow_templates:
    - binary-triage
team_templates:
    - binary-triage-team
policy_rules:
    - risk_at_least
    - team_approval_gate
examples:
    - title: Triage a binary artifact
      description: Inspect metadata, strings, and suspicious offsets before producing an evidence-backed report.
      request: Analyze sample.bin for risky imports, protocol strings, packed sections, and likely vulnerability surfaces.
      workflow: skill-chain
      agent: binary-analyst
    - title: Defensive binary workflow
      description: Plan static analysis, collect evidence, branch on risk, and report next reversing actions.
      request: Run static binary triage on sample.bin without executing it.
      workflow: binary-triage
      agent: binary-analyst
vertical_pack:
    domain: binary-analysis
    maturity: guided
    summary: Performs static binary and reverse-engineering triage using metadata, strings, hex previews, and defensive vulnerability reasoning.
    supported_tasks:
        - static binary metadata review
        - printable string triage
        - suspicious indicator extraction
        - reverse-analysis note generation
        - follow-up vulnerability hypothesis report
    required_inputs:
        - binary path
        - analysis objective
        - allowed analysis depth
        - target platform when known
    tool_boundaries:
        - Do not execute untrusted binaries.
        - Use bounded metadata, strings, and hex previews.
        - Treat deeper disassembly/debugging as a future specialized tool boundary.
    safety_gates:
        - Keep analysis static by default.
        - Require operator approval before any future execution-capable workflow.
    quality_gates:
        - Requires file metadata.
        - Requires evidence for suspicious indicators.
        - Requires confidence and next analysis steps.
    evidence_artifacts:
        - binary metadata
        - string indicators
        - hex evidence
        - reverse notes
        - risk report
    simple_mode:
        - Show file path, metadata, suspicious indicators, and next steps.
    expert_mode:
        - Show offsets, tool outputs, artifact refs, static-analysis limits, and follow-up tool gaps.
    token_strategy:
        - Return bounded strings and hex snippets instead of full binary content.
        - Keep raw binary data out of prompts.
    model_routes:
        strong:
            - risk interpretation
            - reverse-analysis synthesis
        worker:
            - metadata extraction
            - string extraction
            - hex preview
        verifier:
            - static evidence review
metadata:
    preset: binary-analysis
    recommended_agent: binary-analyst
    recommended_workflow: binary-triage
    scaffold_preset: binary-analysis
    recommended_team: binary-triage-team
    primary_skill: binary-vulnerability-research
