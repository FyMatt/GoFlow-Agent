kind: goflow.kit
version: 1
min_supported_version: 1
name: binary-analysis-kit
title: Binary Analysis Kit
description: Triage binary artifacts with built-in Python metadata, strings, hex preview, reverse-engineering, and vulnerability-research skills.
category: security
tags:
    - binary
    - reverse-engineering
    - security
agents:
    - planner
    - binary-analyst
    - security-researcher
    - auditor
providers:
    - primary
skills:
    - execution-plan
    - binary-vulnerability-research
    - reverse-engineering
    - vulnerability-research
tools:
    - python_notes/binary_file_info
    - python_notes/binary_strings
    - python_notes/hex_preview
    - python_notes/binary_format_summary
    - python_notes/binary_entropy_map
    - python_notes/binary_symbol_hints
    - python_notes/binary_extract_window
    - file_tools/read_file
workflows:
