kind: goflow.kit
version: 1
min_supported_version: 1
name: operations-runbook-kit
title: Operations Runbook Kit
description: Create operator-safe runbooks with prechecks, rollback, risk review, approval gates, and execution handoff.
category: operations
tags:
    - operations
    - runbook
    - rollback
    - approval
agents:
    - chat
    - operations-specialist
    - documentation-specialist
    - planner
    - fixer
    - auditor
providers:
    - primary
skills:
    - execution-plan
    - code-writing
    - code-audit
tools:
    - file_tools/read_file
    - file_tools/search_files
    - file_tools/write_file
    - network_tools/device_discovery_plan
    - network_tools/device_command_plan
    - network_tools/device_config_dry_run
    - network_tools/device_restconf_live_apply
workflows:
    - plan-fix-audit
workflow_templates:
    - operations-runbook
    - docs-review-publish
team_templates:
    - operations-runbook-team
    - documentation-team
    - documentation-team
policy_rules:
    - expression
    - team_approval_gate
examples:
    - title: Create a deployment runbook
      description: Draft a runbook with prechecks, execution steps, rollback, success signals, and approval notes.
      request: Create an operations runbook for this deployment with rollback guidance.
      workflow: operations-runbook
      agent: operations-specialist
    - title: Plan network device discovery
      description: Validate device scope, allowed hosts, credential references, and read-only command allowlists before any device connector is used.
      request: Plan read-only discovery for router 192.0.2.10 using allowed host 192.0.2.0/24 and commands show version, show interfaces status.
      workflow: operations-runbook
      agent: operations-specialist
vertical_pack:
    domain: operations-runbook
    maturity: production-ready
    summary: Builds operator-safe runbooks and network-device change plans with prerequisites, prechecks, read-only discovery plans, rollback, approval notes, and verification evidence.
    supported_tasks:
        - deployment runbook drafting
        - incident checklist drafting
        - rollback planning
        - operational handoff review
        - network device read-only discovery planning
        - network device configuration dry-run planning
    required_inputs:
        - system or service
        - change objective
        - precheck signals
        - rollback condition
        - approval owner
        - device IP or hostname for network-device work
        - allowed_hosts and credential_ref for network-device work
    tool_boundaries:
        - Default workflow drafts and reviews runbooks; it does not execute infrastructure changes.
        - network_tools validates device scope, host allowlists, command allowlists, credential refs, dry-run status, rollback, approval metadata, and audit notes.
        - network_tools planning tools do not open device connections or apply configuration.
        - network_tools/device_restconf_live_apply is the controlled live RESTCONF/API connector and requires stage.execution live readiness, explicit live enablement, credential refs, approvals, dry-run evidence, rollback, method/path allowlists, and audit output.
    safety_gates:
        - Require approval before execution-capable steps.
        - Require rollback and verification before final handoff.
        - Require authorized_scope=true and allowed_hosts before any network-device plan.
        - Reject commands outside the operator-provided allowlist.
    quality_gates:
        - Requires prechecks.
        - Requires execution steps.
        - Requires rollback and success signals.
        - Requires device evidence contract or a stated blocker for network-device work.
    evidence_artifacts:
        - runbook draft
        - risk review
        - approval notes
        - rollback plan
        - network-device discovery plan
        - network-device dry-run plan
        - controlled RESTCONF live apply audit record
        - final handoff
    simple_mode:
        - Show service or device, change goal, authorized scope, allowed hosts, prechecks, approval status, rollback, and final runbook.
    expert_mode:
        - Show raw workflow graph, policy gates, network_tools allowlists, credential refs, live connector boundaries, and artifact refs.
    token_strategy:
        - Keep device or environment evidence as summaries and refs.
        - Pass only precheck, rollback, device-plan, and status contracts between stages.
    model_routes:
        strong:
            - risk planning
            - rollback review
            - final handoff synthesis
        worker:
            - runbook drafting
            - checklist generation
        verifier:
            - safety and completeness review
metadata:
    preset: operations-runbook
    recommended_agent: operations-specialist
    recommended_workflow: operations-runbook
    recommended_team: operations-runbook-team
    primary_skill: execution-plan
    scaffold_preset: operations-runbook
