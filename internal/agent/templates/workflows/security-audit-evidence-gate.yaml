kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: security-audit-evidence-gate
title: Security Audit Evidence Gate
description: Collect target scope, gather evidence, audit findings, and route through a quality gate before reporting.
category: security
tags:
    - security
    - evidence
    - quality_gate
    - manual-input
stages: 9
graph:
    name: security-audit-evidence-gate
    description: Security audit workflow with operator scope, evidence artifacts, authorization blockers, attack-path hypothesis, exploitability arbitration, disallowed actions, quality gate, disclosure-safe reporting, and red/blue handoff.
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - scope
          position:
            x: 60
            "y": 220
        - name: scope
          node_type: input_gate
          agent: ""
          skill: ""
          params:
            fields_json: '{"fields":[{"name":"target","type":"text","label":"Target URL, file, binary, config, or system","required":true},{"name":"scope","type":"textarea","label":"Authorized scope","required":true},{"name":"allowed_actions","type":"textarea","label":"Allowed actions and exclusions","required":true},{"name":"active_validation_approved","type":"checkbox","label":"Active validation approved","default":false},{"name":"depth","type":"integer","default":"1","min":"1","max":"3"}]}'
            manual: "true"
            prompt: Provide the authorized target, scope, allowed actions, exclusions, and depth before security analysis. Missing authorization must remain visible as an authorization blocker.
          outputs:
            active_validation_approved: params.active_validation_approved
            allowed_actions: params.allowed_actions
            depth: params.depth
            scope: params.scope
            target: params.target
          next:
            - collect
          position:
            x: 320
            "y": 210
        - name: collect
          node_type: skill
          agent: web-security-researcher
          skill: web-vulnerability-research
          params:
            output_contract: Emit sections named Scope Summary, Authorization Blockers, Disallowed Actions, Evidence Summary, Code Evidence, Browser Evidence, Binary Evidence, Configuration Evidence, Probe Surface, Attack-Path Hypothesis, Findings, Confidence, Limitations, and Recommended Verification.
            evidence_rule: Keep evidence tied to the operator-provided scope, require authorized_scope=true and allowed_hosts before browser_snapshot, use browser_probe_points only for scoped probe surface enumeration unless active_probe_approved=true, keep offensive validation non-destructive, and run binary/static helpers or redaction checks only when relevant local artifacts exist.
            allowed_tools: file_tools/read_file,file_tools/search_files,web_tools/fetch_page_assets,web_tools/browser_snapshot,web_tools/browser_probe_points,web_tools/fetch_url,web_tools/web_search,python_notes/binary_format_summary,python_notes/binary_entropy_map,python_notes/binary_symbol_hints,python_notes/redaction_check
          input:
            active_validation_approved: stages.scope.outputs.active_validation_approved
            allowed_actions: stages.scope.outputs.allowed_actions
            scope: stages.scope.outputs.scope
            target: stages.scope.outputs.target
          outputs:
            evidence: result.output
            findings: result.findings
            summary: result.summary
          artifacts:
            - name: web-evidence
              kind: evidence
              title: Collected web evidence
              ref: result.output
              summary: Scope-bound code, web, browser, binary, configuration, redaction, and probe-surface evidence.
          acceptance_criteria:
            - name: target-covered
              ref: result.output
              contains: http
              expected: evidence references fetched target material
            - name: browser-boundary-stated
              ref: result.output
              contains: Browser Evidence
              expected: evidence states browser automation scope, authorization, or limitations
            - name: authorization-blockers-stated
              ref: result.output
              contains: Authorization Blockers
              expected: evidence records missing authorization or states no blocker
            - name: attack-path-hypothesis-stated
              ref: result.output
              contains: Attack-Path Hypothesis
              expected: evidence records attack-path hypothesis or a scoped blocker
          next:
            - audit
          position:
            x: 620
            "y": 190
        - name: audit
          node_type: skill
          agent: auditor
          skill: code-audit
          params:
            output_contract: Emit sections named Audit Decision, Exploitability Arbitration, Evidence Sufficiency, Severity Confidence, Disallowed Actions, Disclosure-Safe Notes, Remediation, and Red/Blue Handoff.
          input:
            evidence: stages.collect.outputs.evidence
          outputs:
            audit: result.output
            findings: result.findings
          artifacts:
            - name: audit-findings
              kind: finding
              title: Audit findings
              ref: result.findings
            - name: audit-report
              kind: report
              title: Audit report
              ref: result.output
          acceptance_criteria:
            - name: risk-classified
              ref: result.output
              contains: risk
              expected: audit classifies risk and impact
            - name: exploitability-arbitrated
              ref: result.output
              contains: Exploitability Arbitration
              expected: audit separates confirmed exploitability from hypotheses
          next:
            - quality
          position:
            x: 920
            "y": 190
        - name: quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            min_score: "75"
            reason: security evidence is insufficient for a final report because authorization, disallowed actions, active validation blockers, exploitability arbitration, evidence sufficiency, severity confidence, disclosure-safe wording, or red/blue handoff is missing
            require_acceptance: "true"
            require_evidence: "true"
          routes:
            fail: remediate
            pass: report
            warning: review
          position:
            x: 1220
            "y": 220
        - name: review
          node_type: checkpoint
          agent: ""
          skill: ""
          params:
            prompt: Review warning-level security evidence before producing the report. Confirm authorization blockers, disallowed actions, active validation blockers, exploitability arbitration, and disclosure-safe red/blue handoff.
          next:
            - report
          position:
            x: 1510
            "y": 110
        - name: report
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            output_contract: Emit sections named Disclosure-Safe Report, Findings, Exploitability Arbitration, Evidence, Remediation, Follow-up Tests, Red/Blue Handoff, Remaining Risks, and Blocked Actions.
          input:
            audit: stages.audit.outputs.audit
            quality: stages.quality.outputs.quality_status
          outputs:
            report: result.output
          artifacts:
            - name: final-security-report
              kind: report
              title: Final security report
              ref: result.output
          next:
            - end
          position:
            x: 1510
            "y": 240
        - name: remediate
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            output_contract: Emit sections named Remediation Plan, Missing Evidence, Authorization Blockers, Disallowed Actions, Active Validation Blockers, Exploitability Gaps, Follow-up Tests, and Red/Blue Handoff.
          input:
            audit: stages.audit.outputs.audit
            failures: stages.quality.outputs.failures
          outputs:
            remediation_plan: result.output
          next:
            - end
          position:
            x: 1510
            "y": 390
        - name: end
          node_type: end
          agent: ""
          skill: ""
          position:
            x: 1810
            "y": 240
