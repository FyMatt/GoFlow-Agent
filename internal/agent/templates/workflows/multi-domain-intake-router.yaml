kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: multi-domain-intake-router
title: 多领域任务分流
description: 收集任务上下文，由规划智能体拆解为边界明确的领域任务，仅并行执行所选分支；需要正式文档时，在领域结果通过质量门后生成、修改并校验真实 Office 交付物。
category: starter
tags:
    - starter
    - multi-domain
    - decomposition
    - parallel
    - model-routing
    - token-budget
    - quality_gate
    - handoff
stages: 24
graph:
    name: multi-domain-intake-router
    description: Default entry workflow for broad tasks. It uses a strong planning route for branch-selection contracts, cheaper bounded domain workers for selected parallel execution, per-branch tool allowlists, cost attribution, artifact-first join, conflict diagnostics, and a quality-gated final handoff.
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - intake
          position:
            x: 60
            "y": 360
        - name: intake
          node_type: input_gate
          agent: ""
          skill: ""
          params:
            max_model_calls: "4"
            max_total_model_calls: "6"
            fields_json: '{"fields":[{"name":"domain","type":"select","label":"Primary domain","label_zh":"\u4e3b\u8981\u9886\u57df","required":true,"options":["auto","software","internet_research","web_security","security","binary","documentation","operations","support","platform","general"],"default":"auto"},{"name":"goal","type":"textarea","label":"Goal","label_zh":"\u76ee\u6807","required":true},{"name":"target","type":"text","label":"Target file, URL, binary, system, device scope, customer context, or platform area","label_zh":"\u76ee\u6807\u6587\u4ef6\u3001URL\u3001\u4e8c\u8fdb\u5236\u3001\u7cfb\u7edf\u3001\u8bbe\u5907\u8303\u56f4\u3001\u5ba2\u6237\u4e0a\u4e0b\u6587\u6216\u5e73\u53f0\u533a\u57df"},{"name":"desired_output","type":"select","label":"Desired output","label_zh":"\u671f\u671b\u8f93\u51fa","options":["implementation","review_report","research_report","runbook","customer_reply","extension_kit","plan","multi_domain_report","office_delivery"],"default":"multi_domain_report"},{"name":"risk_tolerance","type":"select","label":"Risk tolerance","label_zh":"\u98ce\u9669\u5bb9\u5fcd\u5ea6","options":["low","medium","high"],"default":"medium"},{"name":"max_parallel_domains","type":"number","label":"Max parallel domains","label_zh":"\u6700\u5927\u5e76\u884c\u9886\u57df\u6570","default":3}]}'
            manual: "true"
            prompt: Confirm the goal, target, desired output, risk tolerance, and maximum parallel domain slices before decomposition.
          outputs:
            desired_output: params.desired_output
            domain: params.domain
            goal: params.goal
            intake_summary: result.summary
            max_parallel_domains: params.max_parallel_domains
            risk_tolerance: params.risk_tolerance
            target: params.target
          next:
            - decompose
          position:
            x: 330
            "y": 360
        - name: decompose
          node_type: agent
          agent: planner
          skill: execution-plan
          model:
            provider: primary
            max_tokens: 1500
            temperature: 0.1
          execution:
            mode: planning
            risk_level: medium
            boundary: multi-domain-decomposition
          params:
            max_model_calls: "5"
            max_total_model_calls: "8"
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            output_contract: Return compact JSON with summary, active_branches, branch_selection_reason, pruned_branches, branch_contracts, per_branch_tool_allowlists, shared_context, acceptance_criteria, risk_gates, model_routes, token_budget, cost_attribution, office_delivery_required, office_delivery_reason, office_delivery_mode, and final_report_contract. active_branches must contain only stage names from software-worker, web-security-worker, research-worker, security-worker, binary-worker, docs-worker, ops-worker, support-worker, platform-worker, or general-worker. office_delivery_mode must be create, template, modify, or none.
            purpose: Decompose the request into only the domain slices needed for this task, then select bounded parallel worker branches. Set office_delivery_required to true when the user asks for Word, Excel, PPT, PDF, a formal cross-domain report, a template-based deliverable, or an accurate modification of an existing office document. Select docs-worker for document-specific analysis, but leave final file production until upstream domain evidence has passed the quality gate.
            token_policy: Select the fewest useful branches, normally one to three. Do not copy raw files, logs, transcripts, secrets, or long evidence. Put details in artifacts or refs. Explain pruned branches so users can locate why a worker did not run.
          input:
            desired_output: stages.intake.outputs.desired_output
            domain: stages.intake.outputs.domain
            goal: stages.intake.outputs.goal
            max_parallel_domains: stages.intake.outputs.max_parallel_domains
            risk_tolerance: stages.intake.outputs.risk_tolerance
            target: stages.intake.outputs.target
          outputs:
            active_branches: result.active_branches
            branch_selection_reason: result.branch_selection_reason
            branch_contracts: result.branch_contracts
            cost_attribution: result.cost_attribution
            per_branch_tool_allowlists: result.per_branch_tool_allowlists
            pruned_branches: result.pruned_branches
            office_delivery_mode: result.office_delivery_mode
            office_delivery_reason: result.office_delivery_reason
            office_delivery_required: result.office_delivery_required
            shared_context: result.shared_context
            summary: result.summary
            task_graph: result.output
          artifacts:
            - name: multi-domain-task-graph
              kind: plan
              title: Multi-domain task graph
              ref: result.output
              summary: Selected domain branches, branch contracts, shared context, acceptance criteria, risk gates, model routes, and token budget.
          acceptance_criteria:
            - name: has-active-branches
              ref: result.output
              contains: active_branches
              expected: decomposition selects bounded worker branches
            - name: has-branch-contracts
              ref: result.output
              contains: branch_contracts
              expected: each selected branch has a compact contract
            - name: has-branch-selection-reason
              ref: result.output
              contains: branch_selection_reason
              expected: decomposition explains why selected branches run
            - name: has-pruned-branches
              ref: result.output
              contains: pruned_branches
              expected: decomposition explains why unselected branches do not run
            - name: has-per-branch-tool-allowlists
              ref: result.output
              contains: per_branch_tool_allowlists
              expected: decomposition constrains tools per selected branch
            - name: has-token-budget
              ref: result.output
              contains: token_budget
              expected: decomposition declares token discipline
            - name: has-cost-attribution
              ref: result.output
              contains: cost_attribution
              expected: decomposition declares cost attribution by selected branch
            - name: has-office-delivery-decision
              ref: result.output
              contains: office_delivery_required
              expected: decomposition explicitly decides whether a real Office deliverable is required
          context:
            include:
                - workflow.input
                - memory.project
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 1800
            prompt_max_tokens: 4300
            request_max_tokens: 1000
            inputs_max_tokens: 900
            parameters_max_tokens: 800
            retrieval:
                enabled: true
                query: "{{input.goal}} {{input.target}}"
          next:
            - dispatch
          position:
            x: 640
            "y": 360
        - name: dispatch
          node_type: parallel
          agent: ""
          skill: ""
          params:
            concurrent: "true"
            active_branches_ref: stages.decompose.outputs.active_branches
            domain_ref: stages.intake.outputs.domain
            fallback_branch: general-worker
            max_parallel_domains_ref: stages.intake.outputs.max_parallel_domains
            selection_error: No runnable domain branch was selected. Review the intake domain and decomposition output.
            token_policy: Fan out only selected branches. Unselected domain workers must not run. Preserve branch_selection_reason, pruned_branches, max_parallel_domains_ref, per_branch_tool_allowlists, and branch blockers for Studio diagnostics.
          outputs:
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            branches: result.branches
            branch_count: result.branch_count
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            pruned_branches: stages.decompose.outputs.pruned_branches
          next:
            - software-worker
            - web-security-worker
            - research-worker
            - security-worker
            - binary-worker
            - docs-worker
            - ops-worker
            - support-worker
            - platform-worker
            - general-worker
          position:
            x: 970
            "y": 360
        - name: software-worker
          node_type: agent
          agent: software-engineer
          skill: code-writing
          model:
            provider: primary
            max_tokens: 850
            temperature: 0.1
          execution:
            mode: dry_run
            risk_level: medium
            boundary: workspace-software-slice
          params:
            require_workspace_mutation: "false"
            domain: software-engineering
            domain_aliases: software,code,coding,implementation,software-engineer
            team_template_ref: software-task-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, evidence, changed_files, verification, cost_attribution, blockers, next_actions, recommended_workflow, and artifact_refs.
            token_policy: Use branch_contracts only. Summarize discovery and verification; do not paste full diffs or large files.
            tools: file_tools/read_file,file_tools/read_files,file_tools/read_file_outline,file_tools/search_files,file_tools/write_file
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            changed_files: result.changed_files
            report: result.output
            summary: result.summary
            verification: result.verification
          artifacts:
            - name: software-domain-report
              kind: report
              title: Software domain report
              ref: result.output
          acceptance_criteria:
            - name: has-domain-summary
              ref: result.output
              contains: summary
              expected: worker returns compact summary
            - name: has-evidence
              ref: result.output
              contains: evidence
              expected: worker records evidence or blocker
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
                - memory.project
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 1000
            prompt_max_tokens: 3000
            request_max_tokens: 500
            inputs_max_tokens: 900
            parameters_max_tokens: 600
          next:
            - join
          position:
            x: 1300
            "y": 20
        - name: web-security-worker
          node_type: agent
          agent: web-security-researcher
          skill: web-vulnerability-research
          model:
            provider: primary
            max_tokens: 850
            temperature: 0.1
          execution:
            mode: dry_run
            risk_level: high
            boundary: authorized-web-evidence
          params:
            require_workspace_mutation: "false"
            domain: web-security
            domain_aliases: web,webapp,web_application,xss,sqli,sql_injection,web-security-researcher
            team_template_ref: web-research-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, evidence, target_scope, findings, verification, cost_attribution, blockers, next_actions, recommended_workflow, and artifact_refs.
            token_policy: Use passive or explicitly authorized browser evidence only. Summarize screenshots/assets by ref, never inline large pages or scripts.
            tools: web_tools/fetch_url,web_tools/fetch_page_assets,web_tools/browser_snapshot,web_tools/browser_probe_points
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            findings: result.findings
            report: result.output
            summary: result.summary
            verification: result.verification
          artifacts:
            - name: web-security-domain-report
              kind: evidence
              title: Web security domain report
              ref: result.output
          acceptance_criteria:
            - name: has-target-scope
              ref: result.output
              contains: target_scope
              expected: web worker states authorized target scope
            - name: has-evidence
              ref: result.output
              contains: evidence
              expected: web worker records evidence or limitations
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 900
            prompt_max_tokens: 2800
            request_max_tokens: 500
            inputs_max_tokens: 850
            parameters_max_tokens: 650
          next:
            - join
          position:
            x: 1300
            "y": 140
        - name: research-worker
          node_type: agent
          agent: research-specialist
          skill: internet-research
          model:
            provider: primary
            max_tokens: 1000
            temperature: 0.1
          execution:
            mode: dry_run
            risk_level: low
            boundary: public-internet-research
          params:
            require_workspace_mutation: "false"
            domain: internet-research
            domain_aliases: research,research-specialist
            team_template_ref: internet-research-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, research_scope, source_snapshots, claim_source_map, source_conflicts, freshness_review, quality_status, cost_attribution, blockers, next_actions, recommended_workflow, and artifact_refs.
            token_policy: Pass source summaries, canonical URLs, fetch times, content hashes, claim mappings, and necessary excerpts only. Never inline complete pages.
            tools: web_tools/web_search,web_tools/research_snapshot,web_tools/compile_research_evidence,file_tools/write_file
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            evidence: result.evidence
            report: result.output
            summary: result.summary
            verification: result.verification
          artifacts:
            - name: internet-research-domain-report
              kind: report
              title: 互联网资料研究领域报告
              ref: result.output
              summary: 研究范围、来源快照、结论来源映射、冲突、时效和交付产物。
          acceptance_criteria:
            - name: has-research-scope
              ref: result.output
              contains: research_scope
              expected: 研究分支明确问题和时间范围
            - name: has-claim-source-map
              ref: result.output
              contains: claim_source_map
              expected: 研究分支保留结论与来源的结构化映射
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 1000
            prompt_max_tokens: 3200
            request_max_tokens: 500
            inputs_max_tokens: 900
            parameters_max_tokens: 700
          next:
            - join
          position:
            x: 1300
            "y": 1100
        - name: security-worker
          node_type: agent
          agent: security-researcher
          skill: vulnerability-research
          model:
            provider: primary
            max_tokens: 800
            temperature: 0.1
          execution:
            mode: planning
            risk_level: high
            boundary: defensive-security-scope
          params:
            require_workspace_mutation: "false"
            domain: security-research
            domain_aliases: security,vulnerability,vulnerability_research,security-researcher
            team_template_ref: audit-security-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, authorized_scope, findings, evidence, exploitability_arbitration, verification, cost_attribution, blockers, next_actions, and artifact_refs.
            token_policy: Stay defensive and evidence-first. Do not provide exploit steps beyond authorized scope.
            tools: file_tools/read_file,file_tools/read_files,file_tools/read_file_outline,file_tools/search_files,web_tools/browser_snapshot,web_tools/browser_probe_points,python_notes/binary_format_summary,python_notes/binary_symbol_hints,python_notes/redaction_check
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            findings: result.findings
            report: result.output
            summary: result.summary
            verification: result.verification
          artifacts:
            - name: security-domain-report
              kind: report
              title: Security domain report
              ref: result.output
          acceptance_criteria:
            - name: has-scope
              ref: result.output
              contains: authorized_scope
              expected: worker states authorized scope or blocker
            - name: has-evidence
              ref: result.output
              contains: evidence
              expected: worker records evidence
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 850
            prompt_max_tokens: 2700
            request_max_tokens: 500
            inputs_max_tokens: 800
            parameters_max_tokens: 600
          next:
            - join
          position:
            x: 1300
            "y": 260
        - name: binary-worker
          node_type: agent
          agent: binary-analyst
          skill: reverse-engineering
          model:
            provider: primary
            max_tokens: 800
            temperature: 0.1
          execution:
            mode: dry_run
            risk_level: medium
            boundary: static-binary-analysis
          params:
            require_workspace_mutation: "false"
            domain: binary-analysis
            domain_aliases: binary,reverse,reverse_engineering,binary-analyst
            team_template_ref: binary-triage-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, sample_scope, format_summary, entropy_packing_hints, symbol_hints, static_evidence, cost_attribution, findings, unsafe_dynamic_analysis_blockers, blockers, next_actions, and artifact_refs.
            token_policy: Prefer metadata, format summary, entropy map, symbol hints, strings, and bounded previews. Do not execute untrusted binaries.
            tools: python_notes/binary_file_info,python_notes/binary_format_summary,python_notes/binary_entropy_map,python_notes/binary_symbol_hints,python_notes/binary_strings,python_notes/hex_preview,python_notes/binary_extract_window
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            findings: result.findings
            report: result.output
            summary: result.summary
          artifacts:
            - name: binary-domain-report
              kind: report
              title: Binary domain report
              ref: result.output
          acceptance_criteria:
            - name: has-static-evidence
              ref: result.output
              contains: static_evidence
              expected: binary worker records static evidence or blocker
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 850
            prompt_max_tokens: 2700
            request_max_tokens: 500
            inputs_max_tokens: 800
            parameters_max_tokens: 600
          next:
            - join
          position:
            x: 1300
            "y": 380
        - name: docs-worker
          node_type: agent
          agent: documentation-specialist
          skill: office-document-production
          model:
            provider: primary
            max_tokens: 750
            temperature: 0.1
          execution:
            mode: planning
            risk_level: low
            boundary: office-document-analysis
          params:
            require_workspace_mutation: "false"
            domain: office-document
            domain_aliases: documentation,docs,doc,documentation-specialist
            team_template_ref: documentation-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, document_mode, source_path, template_path, requested_formats, document_scope, modification_plan, preservation_rules, validation_plan, cost_attribution, evidence, blockers, next_actions, and artifact_refs. document_mode must be create, template, or modify. For template and modify modes, identify exact targets and content that must remain unchanged.
            token_policy: Inspect only the source or template structure needed to form an auditable modification plan. Cite document paths, sections, sheets, slides, placeholders, hashes, and artifact refs instead of copying whole documents.
            tools: office_tools/office_capabilities,office_tools/inspect_office_document,office_tools/validate_office_document,file_tools/read_file,file_tools/read_files,file_tools/read_file_outline,file_tools/search_files
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            report: result.output
            summary: result.summary
          artifacts:
            - name: documentation-domain-report
              kind: report
              title: 办公文档处理方案
              ref: result.output
          acceptance_criteria:
            - name: has-document-mode
              ref: result.output
              contains: document_mode
              expected: 明确从零制作、基于模板生成或修改现有文档
            - name: has-preservation-rules
              ref: result.output
              contains: preservation_rules
              expected: 明确保留样式、母版、公式和未指定内容的约束
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 800
            prompt_max_tokens: 2500
            request_max_tokens: 450
            inputs_max_tokens: 750
            parameters_max_tokens: 550
          next:
            - join
          position:
            x: 1300
            "y": 500
        - name: ops-worker
          node_type: agent
          agent: operations-specialist
          skill: execution-plan
          model:
            provider: primary
            max_tokens: 800
            temperature: 0.1
          execution:
            mode: dry_run
            risk_level: high
            boundary: operations-dry-run
          params:
            require_workspace_mutation: "false"
            domain: operations-runbook
            domain_aliases: operations,ops,network,network_operations,runbook,operations-specialist
            team_template_ref: operations-runbook-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, authorized_scope, prechecks, dry_run_plan, rollback, evidence, cost_attribution, blockers, next_actions, and artifact_refs.
            token_policy: Plan device/system work with authorized scope, credential refs, allowlists, dry-run and rollback evidence. Do not apply changes directly.
            tools: network_tools/device_discovery_plan,network_tools/device_command_plan,network_tools/device_config_dry_run
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            report: result.output
            summary: result.summary
            verification: result.verification
          artifacts:
            - name: operations-domain-report
              kind: runbook
              title: Operations domain report
              ref: result.output
          acceptance_criteria:
            - name: has-authorized-scope
              ref: result.output
              contains: authorized_scope
              expected: ops worker states authorized scope
            - name: has-rollback
              ref: result.output
              contains: rollback
              expected: ops worker includes rollback or blocker
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 850
            prompt_max_tokens: 2700
            request_max_tokens: 500
            inputs_max_tokens: 800
            parameters_max_tokens: 650
          next:
