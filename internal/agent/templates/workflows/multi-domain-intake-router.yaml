kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: multi-domain-intake-router
title: Multi-Domain Parallel Intake Router
description: Collect task context, let a strong planner decompose the request into bounded domain slices, run only the selected domain workers in parallel, then join, audit, and hand off a compact final report.
category: starter
tags:
    - starter
    - multi-domain
    - decomposition
    - parallel
    - model-routing
    - token-budget
    - quality_gate
    - handoff
stages: 21
graph:
    name: multi-domain-intake-router
    description: Default entry workflow for broad tasks. It uses a strong planning route for branch-selection contracts, cheaper bounded domain workers for selected parallel execution, per-branch tool allowlists, cost attribution, artifact-first join, conflict diagnostics, and a quality-gated final handoff.
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - intake
          position:
            x: 60
            "y": 360
        - name: intake
          node_type: input_gate
          agent: ""
          skill: ""
          params:
            fields_json: '{"fields":[{"name":"domain","type":"select","label":"Primary domain","label_zh":"\u4e3b\u8981\u9886\u57df","required":true,"options":["auto","software","web_security","security","binary","documentation","operations","support","platform","general"],"default":"auto"},{"name":"goal","type":"textarea","label":"Goal","label_zh":"\u76ee\u6807","required":true},{"name":"target","type":"text","label":"Target file, URL, binary, system, device scope, customer context, or platform area","label_zh":"\u76ee\u6807\u6587\u4ef6\u3001URL\u3001\u4e8c\u8fdb\u5236\u3001\u7cfb\u7edf\u3001\u8bbe\u5907\u8303\u56f4\u3001\u5ba2\u6237\u4e0a\u4e0b\u6587\u6216\u5e73\u53f0\u533a\u57df"},{"name":"desired_output","type":"select","label":"Desired output","label_zh":"\u671f\u671b\u8f93\u51fa","options":["implementation","review_report","runbook","customer_reply","extension_kit","plan","multi_domain_report"],"default":"multi_domain_report"},{"name":"risk_tolerance","type":"select","label":"Risk tolerance","label_zh":"\u98ce\u9669\u5bb9\u5fcd\u5ea6","options":["low","medium","high"],"default":"medium"},{"name":"max_parallel_domains","type":"number","label":"Max parallel domains","label_zh":"\u6700\u5927\u5e76\u884c\u9886\u57df\u6570","default":3}]}'
            manual: "true"
            prompt: Confirm the goal, target, desired output, risk tolerance, and maximum parallel domain slices before decomposition.
          outputs:
            desired_output: params.desired_output
            domain: params.domain
            goal: params.goal
            intake_summary: result.summary
            max_parallel_domains: params.max_parallel_domains
            risk_tolerance: params.risk_tolerance
            target: params.target
          next:
            - decompose
          position:
            x: 330
            "y": 360
        - name: decompose
          node_type: agent
          agent: planner
          skill: execution-plan
          model:
            provider: primary
            max_tokens: 1500
            temperature: 0.1
          execution:
            mode: planning
            risk_level: medium
            boundary: multi-domain-decomposition
          params:
            output_contract: Return compact JSON with summary, active_branches, branch_selection_reason, pruned_branches, branch_contracts, per_branch_tool_allowlists, shared_context, acceptance_criteria, risk_gates, model_routes, token_budget, cost_attribution, and final_report_contract. active_branches must contain only stage names from software-worker, web-security-worker, security-worker, binary-worker, docs-worker, ops-worker, support-worker, platform-worker, or general-worker.
            purpose: Decompose the request into only the domain slices needed for this task, then select bounded parallel worker branches.
            token_policy: Select the fewest useful branches, normally one to three. Do not copy raw files, logs, transcripts, secrets, or long evidence. Put details in artifacts or refs. Explain pruned branches so users can locate why a worker did not run.
          input:
            desired_output: stages.intake.outputs.desired_output
            domain: stages.intake.outputs.domain
            goal: stages.intake.outputs.goal
            max_parallel_domains: stages.intake.outputs.max_parallel_domains
            risk_tolerance: stages.intake.outputs.risk_tolerance
            target: stages.intake.outputs.target
          outputs:
            active_branches: result.active_branches
            branch_selection_reason: result.branch_selection_reason
            branch_contracts: result.branch_contracts
            cost_attribution: result.cost_attribution
            per_branch_tool_allowlists: result.per_branch_tool_allowlists
            pruned_branches: result.pruned_branches
            shared_context: result.shared_context
            summary: result.summary
            task_graph: result.output
          artifacts:
            - name: multi-domain-task-graph
              kind: plan
              title: Multi-domain task graph
              ref: result.output
              summary: Selected domain branches, branch contracts, shared context, acceptance criteria, risk gates, model routes, and token budget.
          acceptance_criteria:
            - name: has-active-branches
              ref: result.output
              contains: active_branches
              expected: decomposition selects bounded worker branches
            - name: has-branch-contracts
              ref: result.output
              contains: branch_contracts
              expected: each selected branch has a compact contract
            - name: has-branch-selection-reason
              ref: result.output
              contains: branch_selection_reason
              expected: decomposition explains why selected branches run
            - name: has-pruned-branches
              ref: result.output
              contains: pruned_branches
              expected: decomposition explains why unselected branches do not run
            - name: has-per-branch-tool-allowlists
              ref: result.output
              contains: per_branch_tool_allowlists
              expected: decomposition constrains tools per selected branch
            - name: has-token-budget
              ref: result.output
              contains: token_budget
              expected: decomposition declares token discipline
            - name: has-cost-attribution
              ref: result.output
              contains: cost_attribution
              expected: decomposition declares cost attribution by selected branch
          context:
            include:
                - workflow.input
                - memory.project
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 1800
            prompt_max_tokens: 4300
            request_max_tokens: 1000
            inputs_max_tokens: 900
            parameters_max_tokens: 800
            retrieval:
                enabled: true
                query: "{{input.goal}} {{input.target}}"
          next:
            - dispatch
          position:
            x: 640
            "y": 360
        - name: dispatch
          node_type: parallel
          agent: ""
          skill: ""
          params:
            concurrent: "true"
            active_branches_ref: stages.decompose.outputs.active_branches
            domain_ref: stages.intake.outputs.domain
            fallback_branch: general-worker
            max_parallel_domains_ref: stages.intake.outputs.max_parallel_domains
            selection_error: No runnable domain branch was selected. Review the intake domain and decomposition output.
            token_policy: Fan out only selected branches. Unselected domain workers must not run. Preserve branch_selection_reason, pruned_branches, max_parallel_domains_ref, per_branch_tool_allowlists, and branch blockers for Studio diagnostics.
          outputs:
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            branches: result.branches
            branch_count: result.branch_count
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            pruned_branches: stages.decompose.outputs.pruned_branches
          next:
            - software-worker
            - web-security-worker
            - security-worker
            - binary-worker
            - docs-worker
            - ops-worker
            - support-worker
            - platform-worker
            - general-worker
          position:
            x: 970
            "y": 360
        - name: software-worker
          node_type: agent
          agent: software-engineer
          skill: code-writing
          model:
            provider: backup
            max_tokens: 850
            temperature: 0.1
          execution:
            mode: dry_run
            risk_level: medium
            boundary: workspace-software-slice
          params:
            domain: software-engineering
            team_template_ref: software-task-team
            worker_contract: domain_slice_v1
            output_contract: Return compact JSON with summary, domain, branch_selection_reason, selected_tool_allowlist, evidence, changed_files, verification, cost_attribution, blockers, next_actions, recommended_workflow, and artifact_refs.
            token_policy: Use branch_contracts only. Summarize discovery and verification; do not paste full diffs or large files.
            tools: file_tools/read_file,file_tools/search_files,file_tools/write_file
          input:
            branch_contracts: stages.decompose.outputs.branch_contracts
            branch_selection_reason: stages.decompose.outputs.branch_selection_reason
            per_branch_tool_allowlists: stages.decompose.outputs.per_branch_tool_allowlists
            request: workflow.input
            shared_context: stages.decompose.outputs.shared_context
          outputs:
            changed_files: result.changed_files
            report: result.output
            summary: result.summary
            verification: result.verification
          artifacts:
            - name: software-domain-report
              kind: report
              title: Software domain report
              ref: result.output
          acceptance_criteria:
            - name: has-domain-summary
              ref: result.output
              contains: summary
              expected: worker returns compact summary
            - name: has-evidence
              ref: result.output
              contains: evidence
              expected: worker records evidence or blocker
          context:
            include:
                - stages.decompose.outputs.branch_contracts
                - stages.decompose.outputs.shared_context
                - memory.project
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 1000
            prompt_max_tokens: 3000
            request_max_tokens: 500
            inputs_max_tokens: 900
            parameters_max_tokens: 600
          next:
            - join
          position:
            x: 1300
            "y": 20
        - name: web-security-worker
          node_type: agent
          agent: web-security-researcher
          skill: web-vulnerability-research
          model:
            provider: backup
            max_tokens: 850
            temperature: 0.1
          execution:
