kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: software-quality-gate
title: Software Quality Gate
description: Plan, implement, verify, audit, and route through an evidence-backed quality gate before handoff.
category: software
tags:
    - coding
    - tests
    - audit
    - quality_gate
    - approval
stages: 10
graph:
    name: software-quality-gate
    description: Complex software implementation workflow with explicit acceptance criteria, artifacts, verifier evidence, and quality-gate routing.
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - plan
          position:
            x: 60
            "y": 220
        - name: plan
          node_type: agent
          agent: planner
          skill: execution-plan
          outputs:
            plan: result.output
          artifacts:
            - name: implementation-plan
              kind: report
              title: Implementation plan
              ref: result.output
          next:
            - implement
          position:
            x: 300
            "y": 200
        - name: implement
          node_type: agent
          agent: fixer
          skill: code-writing
          input:
            plan: stages.plan.outputs.plan
          outputs:
            changes: result.changes
            summary: result.summary
          artifacts:
            - name: change-summary
              kind: change
              title: Change summary
              ref: result.changes
          acceptance_criteria:
            - name: changes-recorded
              ref: result.output
              contains: change
              expected: implementation explains changed behavior
          retry:
            max_attempts: 2
          approval: true
          next:
            - verify
          position:
            x: 580
            "y": 200
        - name: verify
          node_type: skill
          agent: auditor
          skill: code-audit
          input:
            changes: stages.implement.outputs.changes
            plan: stages.plan.outputs.plan
          outputs:
            verification: result.output
          artifacts:
            - name: verification-report
              kind: verification
              title: Verification report
              ref: result.output
          acceptance_criteria:
            - name: verification-evidence
              ref: result.output
              contains: test
              expected: verification mentions tests or equivalent checks
          next:
            - audit
          position:
            x: 860
            "y": 200
        - name: audit
          node_type: skill
          agent: auditor
          skill: code-audit
          input:
            changes: stages.implement.outputs.changes
            verification: stages.verify.outputs.verification
          outputs:
            audit: result.output
            findings: result.findings
          artifacts:
            - name: audit-report
              kind: report
              title: Audit report
              ref: result.output
          acceptance_criteria:
            - name: audit-risk-reviewed
              ref: result.output
              contains: risk
              expected: audit mentions residual risk
          next:
            - quality
          position:
            x: 1140
            "y": 200
        - name: quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            min_score: "80"
            reason: software quality evidence did not meet the release threshold
            require_acceptance: "true"
            require_evidence: "true"
            require_verification: "true"
          routes:
            fail: revise
            pass: handoff
            warning: review
          position:
            x: 1420
            "y": 220
        - name: handoff
          node_type: skill
          agent: planner
          skill: execution-plan
          input:
            audit: stages.audit.outputs.audit
            quality: stages.quality.outputs.quality_status
          outputs:
            handoff: result.output
          next:
            - end
          position:
            x: 1700
            "y": 120
        - name: review
          node_type: checkpoint
          agent: ""
          skill: ""
          params:
            prompt: Quality gate returned warnings. Review evidence before handoff.
          next:
            - handoff
          position:
            x: 1700
            "y": 260
        - name: revise
          node_type: skill
          agent: fixer
          skill: code-writing
          input:
            audit: stages.audit.outputs.audit
            failures: stages.quality.outputs.failures
          outputs:
            revision_plan: result.output
          next:
            - end
          position:
            x: 1700
            "y": 400
        - name: end
          node_type: end
          agent: ""
          skill: ""
          position:
            x: 2020
            "y": 220
