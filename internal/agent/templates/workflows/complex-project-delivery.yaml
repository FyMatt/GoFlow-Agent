kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: complex-project-delivery
title: 复杂项目交付
description: 规划边界明确的项目改动，经一次确认后实施并可靠重试，用一次统一验证完成测试、构建和静态检查，审计证据并输出统一交付结果。
category: software
tags:
    - golden-reference
    - runnable
    - golden-scenario-2
    - complex-task
    - approval
    - durable-retry
    - focused-verification
    - recovery
    - report
stages: 15
graph:
    name: complex-project-delivery
    description: 精简的复杂本地项目交付流程：一次计划确认、幂等实施、统一验证、独立审计、质量门、必要恢复和最终证据。
    budget:
        soft_llm_calls: 45
        hard_llm_calls: 72
        soft_continuations: 2
        hard_continuations: 4
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - plan
          position:
            x: 60
            "y": 260
        - name: plan
          node_type: agent
          agent: planner
          skill: execution-plan
          params:
            max_total_model_calls: "8"
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            change_slice_policy: "required"
            seed_plan_intake: "true"
            output_contract: Emit sections named Intake Mode, 设计方案 or 需求确认, Delivery Plan, 界面设计 when the request is HTML/web, Target Files, Change Slices, Dependencies, Acceptance Checks, Verification Commands, Failure Recovery, and Definition of Done. If the user prompt is short, write 设计方案 and explicitly ask whether it is feasible; do not treat that as already approved implementation. If the user prompt is detailed, write 需求确认 restating scope, pages, visual bar, tests, and out-of-scope items, then the delivery plan. End with a fenced block labelled goflow-change-slices containing a JSON array. Every item must contain id, title, mode, depends_on, input_files, target_files, and verification_commands. mode must be read for side-effect-free analysis or write for any filesystem mutation. IDs must be stable ASCII identifiers; paths must be workspace-relative; dependencies must form a DAG; commands must be executable argument-safe command lines selected from repository evidence.
            flaky_rule: 并发相关改动必须用 go test ./... -count=2 连跑两遍，两遍都通过才算验证通过；偶发失败按失败处理并继续修复。
            purpose: Call repository_map once for the overview, then read only the modules, callers and tests that map identifies; never substitute an entry point for a module. input_files holds unchanged fixtures and tests; target_files names only files that must change. No write slice for verification-only work. Classify intake first; short prompts need a design confirmation, detailed prompts need requirements confirmation. Batch reads and reuse observations. Split changes into dependency-ordered slices. Emit at most three change slices; merge each module's implementation and its tests into one slice, because every extra slice costs a full discovery round and long deliveries miss their budget. A web plan must include a real stylesheet, layout and visual acceptance.
            verification_policy: Keep verification proportional. Do not add race, coverage, benchmark, or generated-report gates unless the request or repository instructions explicitly require them.
            tools: file_tools/repository_map,file_tools/read_file,file_tools/read_file_range,file_tools/read_files,file_tools/read_file_outline,file_tools/search_files,web_tools/web_search,web_tools/fetch_url,web_tools/research_snapshot
            max_iterations: "12"
            max_model_calls: "6"
          retry:
            max_attempts: 3
          outputs:
            plan: result.output
            summary: result.summary
          artifacts:
            - name: delivery-plan
              kind: plan
              title: Delivery plan
              ref: result.output
              summary: Target files, change slices, dependencies, acceptance checks, verification commands, recovery, and definition of done.
          acceptance_criteria:
            - name: has-change-slices
              ref: result.output
              contains: goflow-change-slices
              expected: plan must contain machine-checkable bounded change slices
            - name: has-verification-commands
              ref: result.output
              exists: true
              expected: plan must name concrete verification commands
            - name: has-failure-recovery
              ref: result.output
              exists: true
              expected: plan must explain failure recovery
          context:
            include:
                - memory.project
                - workflow.input
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 3600
            prompt_max_tokens: 8200
            request_max_tokens: 1600
            # 2600 -> 1600 tokens: every stage carried the whole plan, which
            # dominated each cold start; target files and acceptance checks
            # stay in their own sections.
            inputs_max_tokens: 1600
            parameters_max_tokens: 1000
          next:
            - approve-plan
          position:
            x: 340
            "y": 260
        - name: approve-plan
          node_type: input_gate
          agent: ""
          skill: ""
          params:
            manual: "true"
            prompt: 请选择交付档位并确认规划。提示偏短时先确认「设计方案」是否可行；提示具体时先确认「需求确认」。MVP 必须能跑通核心流程、测试，且页面引用样式表。完整产品还要有顶栏/导航/主区结构和可日常使用的界面。Web 门户禁止只交无样式表格。
            fields_json: '{"fields":[{"name":"delivery_scope","type":"select","label":"Delivery scope","label_zh":"交付档位","required":true,"options":["MVP","完整产品"],"default":"MVP","description":"MVP is the smallest working loop. 完整产品 adds daily-use layout and visual completeness."}]}'
          outputs:
            delivery_scope: params.delivery_scope
          next:
            - implement
          position:
            x: 640
            "y": 260
        - name: implement
          node_type: agent
          agent: fixer
          skill: code-writing
          approval: true
          params:
            max_total_model_calls: "24"
            require_workspace_mutation: "true"
            use_change_slice_scheduler: "true"
            worker_contract: engineering_v1
            output_contract: Return one compact engineering_v1 JSON object. Write summary, evidence, verification, blockers, and next_actions in the user's language; for Chinese requests use clear Simplified Chinese. Populate changed_files with every workspace-relative path changed by this stage and include a 变更摘要. Keep the final message under 400 characters; never paste file contents or diffs into it.
            edit_policy: >-
              The approve-plan gate already approved this delivery. Do not wait for another approval; write the approved target files in this stage. Keep each change slice within two model turns: one batched read of the files that slice targets, then one batched edit of all of them. Do not re-read a file you already read in this stage and do not run tests inside a slice; the verify stage runs the full suite once.
              Follow the approved plan, preserve user edits, use exact patches for existing files, create explicitly requested deliverables when absent, and leave unrelated files untouched.
              Before creating a source file, list the workspace root and search for the requested package, symbol, or filename. Modify an existing implementation at its exact relative path; never create a root-level duplicate because a guessed path was missing. Never edit an existing *_test.go file; add new tests in a new file whose Test function names do not already exist (search the package first). A duplicate test name breaks the whole package build, and rewriting an assertion silently corrupts the suite.
              Match the user's language for documentation; for Chinese requests, write Simplified Chinese and preserve literal acceptance terms.
              Do not weaken observable requirements as design trade-offs: stateful, time-based, and concurrent APIs must verify key state transitions through every exported observer, and expired or deleted data must not remain visible through count or length APIs unless the user explicitly requires that behavior. Shared maps and caches that are called concurrently must be mutex-protected on every exported read and write, including Set, Get, and Len.
              Reuse the approved plan's exact paths and execute its change slices in dependency order. Batch independent reads and edits in one response; read several files with one file_tools/read_files call and apply small changes to several files with one file_tools/apply_edits call instead of one call per file. Do not reread unchanged files, and write each new file once. After each slice, inspect the resulting Diff or run one focused package test only when it can catch an integration error before the next slice. Across the whole implementation stage run at most four distinct immediate checks. Do not run the complete repository test suite, race detector, vet, build matrix, or independent audit commands in this stage; those belong exclusively to verify. If a retry prompt includes FAIL output from an existing public test, patch that implementation until Applied, Failed, RolledBack, and StoppedBefore match the test, then write requested JSON or Markdown deliverables. Never rewrite existing tests; create requested new test files that are absent. When the request is an HTML or campus/web portal, unstyled markup is not delivery: ship a real stylesheet (static .css or a style block) with layout, color, type, spacing, and classed forms/tables. Do not ship table border=1 as the only visual design. Avoid purple gradients and marketing-hero layouts; pages must look like an operational console a person can use. Honor delivery_scope: MVP is a working loop plus a linked stylesheet; 完整产品 also requires header/nav/main or an equivalent classed shell so the UI can be used as a daily product. If a slice fails, repair that slice or stop with concrete evidence instead of continuing on an invalid base. Concurrency rules: every read and write of shared state (maps, slices, counters) must happen under one lock; a value written by Set must be readable by Get immediately for the same key; never write while holding a read lock and never copy a struct that contains a mutex. Before finishing, run exactly one build check for the touched language (go build ./... for Go); if it fails, fix it in this stage instead of spending a whole repair round. After all approved slices and immediate checks finish, stop calling tools and produce the implementation report.
            tools: file_tools/list_tree,file_tools/read_file,file_tools/read_file_range,file_tools/read_files,file_tools/read_file_outline,file_tools/search_files,file_tools/apply_patch,file_tools/apply_edits,file_tools/write_file,file_tools/mkdir,command_tools/run_command
            max_iterations: "40"
            max_model_calls: "16"
            max_command_calls: "4"
            allowed_command_classes: format,test,build
            approved_plan_scope: "true"
          input:
            plan: stages.plan.outputs.plan
            request: workflow.input
            delivery_scope: stages.approve-plan.outputs.delivery_scope
          outputs:
            implementation: result.output
            changed_files: result.changed_files
            changes: result.changes
            verification: result.verification
            summary: result.summary
          artifacts:
            - name: implementation-report
              kind: report
              title: Implementation report
              ref: result.output
              summary: Changed files, requirements covered, verification attempted, recovery actions, and remaining risks.
          acceptance_criteria:
            - name: has-change-summary
              ref: result.summary
              exists: true
              expected: implementation explains the delivered behavior
            - name: has-files-changed
              ref: result.changed_files
              exists: true
              expected: implementation lists all changed files
            - name: has-verification-attempted
              ref: result.verification
              exists: true
              expected: implementation records immediate checks
          retry:
            max_attempts: 4
          context:
            include:
                - stages.plan.outputs.plan
                - files.changed
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 5600
            prompt_max_tokens: 12000
            request_max_tokens: 1800
            inputs_max_tokens: 4600
            parameters_max_tokens: 1200
          next:
            - verify
          position:
            x: 940
            "y": 260
        - name: verify
          node_type: skill
          agent: quality-engineer
          skill: code-audit
          approval: true
          params:
            max_total_model_calls: "10"
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            use_change_slice_scheduler: "false"
            output_contract: First line must be exactly 总体结论：通过 or 总体结论：未通过 using plain text without Markdown decoration. Then emit sections named Verification Result, Commands Run, Tests and Build, Static Analysis, Formatting, Failure Evidence, Infrastructure Limits, and Residual Risk. Decide 未通过 only for a required check you actually ran and that failed, or for a missing deliverable. When a required command has not run yet and the command budget still allows it, run it before deciding; never mark 未通过 for a check that was simply not attempted. A documented and approved race infrastructure deferral alone does not fail the overall result; explicitly state that local race did not run.
            verification_scope: Run the exact verification selected by the approved plan in one bounded pass. Start with focused checks for changed modules, then run the smallest complete integration gate that covers the delivered behavior. Execute at most six distinct commands, never repeat a passing command or run equivalent variants. For Go, run the ordinary go test command first so it is the verified fallback, then use exactly gofmt -l . for a non-mutating formatting check when required, then go vet, and run go test -race last when required. Never use go fmt -l because go fmt does not support that check. One successful full go test command already covers compilation; do not add a duplicate go build unless the request explicitly requires a binary. If race is unavailable because of CGO or a missing C compiler, reuse the already successful ordinary test as the fallback, verify an Ubuntu CI race gate, and report the limitation without another command or retry loop. Do not modify source files.
            tools: file_tools/read_file,file_tools/read_file_range,file_tools/read_file_outline,command_tools/run_command,command_tools/start_process,command_tools/process_status,command_tools/stop_process,web_tools/browser_snapshot,web_tools/web_search,web_tools/fetch_url,web_tools/research_snapshot
            max_iterations: "8"
            max_model_calls: "8"
            max_command_calls: "6"
            max_read_calls: "4"
            allowed_command_classes: format,test,build,lint
            approved_plan_scope: "true"
          input:
            implementation: stages.implement.outputs.implementation
            plan: stages.plan.outputs.plan
            request: workflow.input
          outputs:
            verification_report: result.output
            verification: result.verification
            summary: result.summary
          artifacts:
            - name: verification-report
              kind: verification
              title: Verification report
              ref: result.output
              summary: Tests, compilation, static analysis, formatting, failure evidence, infrastructure limits, and residual risk.
          acceptance_criteria:
            - name: has-verification-result
              ref: result.first_line
              equals: 总体结论：通过
              expected: 整体验证明确通过后才可验收；未通过的报告保留用于修复。
            - name: has-verification-commands
              ref: result.output
              contains: Commands Run
              expected: report records exact commands
            - name: has-failure-evidence
              ref: result.output
              contains: Failure Evidence
              expected: injected or real failures remain visible
          retry:
            max_attempts: 2
          context:
            include:
                - stages.plan.outputs.plan
                - stages.implement.outputs.implementation
            exclude:
                - raw_tool_logs
                - large_file_contents
                - unrelated_session_history
            max_tokens: 5000
            prompt_max_tokens: 11000
            request_max_tokens: 1600
            inputs_max_tokens: 4200
          next:
            - verification-route
          position:
            x: 1260
            "y": 260
        - name: verification-route
          node_type: quality_gate
          params:
            stages: verify
            require_acceptance: "true"
            require_evidence: "true"
            require_verification: "true"
            verification_mode: command
            allow_unknown: "false"
            allowed_infrastructure_failures: go_race_unavailable
          routes:
            pass: audit
            warning: quality
            fail: quality
          position:
            x: 1660
            "y": 260
        - name: audit
          model:
            max_tokens: 1400
          node_type: skill
          agent: auditor
          skill: code-audit
          params:
            max_total_model_calls: "6"
            require_workspace_mutation: "false"
            change_slice_policy: "if_missing"
            output_contract: First line must be exactly 总体结论：通过 or 总体结论：未通过 using plain text without Markdown decoration. Then emit sections named Audit Decision, Requirements Coverage, Verification Evidence, Blocking Findings, Recovery Status, and Recommendation. Decide 未通过 for unresolved requested work, missing deliverables or failed verification. A documented and approved infrastructure deferral alone is not a blocking defect; never claim the deferred check actually ran.
            review_scope: Compare the implementation and the unified verification evidence with the user request and approved plan. Treat any unapproved weakening of observable semantics as a blocking defect, especially when state transitions leave expired or deleted data visible through other exported observers. Lead with concrete defects and missing evidence. Evidence is already supplied in the stage inputs; do not execute commands or perform broad repository discovery. Use the read_file tool at most once only when one specific conflict cannot be resolved from the supplied evidence.
            tools: file_tools/read_file
            max_iterations: "3"
            max_read_calls: "1"
          input:
            implementation: stages.implement.outputs.implementation
            plan: stages.plan.outputs.plan
            verification: stages.verify.outputs.verification_report
          outputs:
            audit: result.output
            findings: result.findings
            summary: result.summary
          artifacts:
            - name: delivery-audit
              kind: audit
              title: Delivery audit
              ref: result.output
              summary: Requirements coverage, unified verification evidence, blocking findings, recovery status, and recommendation.
          acceptance_criteria:
            - name: has-audit-decision
              ref: result.first_line
              equals: 总体结论：通过
              expected: 审计明确通过后才可验收；未通过的报告保留用于修复。
            - name: has-requirements-coverage
              ref: result.output
              contains: Requirements Coverage
              expected: audit maps evidence to requirements
            - name: has-recovery-status
              ref: result.output
              contains: Recovery Status
              expected: audit reports whether injected or real failures recovered
          retry:
            max_attempts: 2
          context:
            exclude:
              - raw_tool_logs
              - large_file_contents
              - unrelated_session_history
            max_tokens: 1800
            prompt_max_tokens: 5200
            request_max_tokens: 900
            inputs_max_tokens: 3800
            parameters_max_tokens: 650
          next:
            - quality
          position:
            x: 2140
            "y": 260
        - name: quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            max_repair_rounds: "2"
            stages: implement,verify,audit
            min_score: "85"
            reason: complex delivery lacks implementation, unified verification, recovery, or audit evidence
            require_acceptance: "true"
            require_evidence: "true"
            require_verification: "true"
            verification_mode: command
            allow_unknown: "false"
            allowed_infrastructure_failures: go_race_unavailable
          routes:
            pass: final-report
            warning: final-report
            fail: repair
          position:
            x: 2440
            "y": 260
        - name: repair
          node_type: skill
          agent: fixer
          skill: code-writing
          approval: true
          params:
            max_total_model_calls: "12"
            require_workspace_mutation: "false"
            no_op_policy: 若审查确认没有遗留阻塞项，直接输出“无需修改”并说明依据，不要为满足变更要求而改无关文件。
            use_change_slice_scheduler: "false"
            worker_contract: engineering_v1
            output_contract: Return one compact engineering_v1 JSON object. Write summary, evidence, verification, blockers, and next_actions in the user's language; for Chinese requests use clear Simplified Chinese. Populate changed_files with every workspace-relative path changed by this repair.
            repair_policy: Fix the concrete blocking findings and incomplete deliverables identified by the implementation, verification, audit and quality gate. Use the approved plan and original task scope; completed initial slices do not prohibit a corrective patch. Locate before reading; use search_files with context_lines or read_file_outline to find the exact function, then read only that range with read_file_range. read_file returns at most 300 lines and reports next_offset; use read_file_range for the rest instead of re-reading the whole file. Read only the smallest affected files, preserve unrelated user work and existing test assertions, add new regression tests for repaired observable defects, and do not weaken the original request. Formatting existing tests is allowed without changing their assertions. Complete requested upgrade and rollback documents when missing. A package that fails to build always needs a change; when the suite reports duplicate declarations, remove the duplicate file or rename the conflicting function. Run at most formatting plus one focused test; leave the unified command set to recovery-verify. When the bounded repair and immediate check finish, stop calling tools and produce the repair report.
            tools: file_tools/read_file,file_tools/read_file_range,file_tools/read_files,file_tools/read_file_outline,file_tools/apply_patch,file_tools/apply_edits,file_tools/write_file,command_tools/run_command
            max_iterations: "12"
            max_model_calls: "8"
            max_command_calls: "3"
            max_read_calls: "6"
            allowed_command_classes: format,test,build,lint
            approved_plan_scope: "true"
          input:
            audit: stages.audit.outputs.audit
            failures: stages.quality.outputs.failures
            implementation: stages.implement.outputs.implementation
            plan: stages.plan.outputs.plan
            request: workflow.input
            verification: stages.verify.outputs.verification_report
          outputs:
            repair: result.output
            changed_files: result.changed_files
            changes: result.changes
            verification: result.verification
            summary: result.summary
          artifacts:
            - name: repair-report
              kind: repair
              title: Repair report
              ref: result.output
              summary: Blocking findings repaired, regression coverage added, immediate checks, recovery actions, and remaining risks.
          acceptance_criteria:
            - name: has-repair-summary
              ref: result.summary
              exists: true
              expected: repair report explains the bounded corrective change
            - name: has-defect-coverage
              ref: result.changed_files
              exists: true
              expected: repair maps regression coverage to the blocking finding
            - name: has-repair-verification
              ref: result.verification
              exists: true
              expected: repair records its focused regression check
          next:
            - recovery-verify
          position:
            x: 2740
            "y": 400
        - name: recovery-verify
          node_type: skill
          agent: quality-engineer
          skill: code-audit
          approval: true
          params:
            max_total_model_calls: "8"
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            use_change_slice_scheduler: "false"
            output_contract: First line must be exactly 总体结论：通过 or 总体结论：未通过 using plain text without Markdown decoration. Then emit sections named Recovery Verification Result, Commands Run, Regression Evidence, Full Test Result, Static Analysis, Infrastructure Limits, and Residual Risk. Decide 未通过 for remaining required failures. An approved race infrastructure deferral alone does not fail the overall result; state that local race did not run.
            verification_scope: Verify the repaired blocking findings first, then run the approved plan's bounded unified checks once. Execute at most four distinct test, build, lint, or non-mutating format commands. For Go, run ordinary go test first, use exactly gofmt -l . for the formatting check, run go vet next, and run go test -race last. Never use go fmt -l. Do not run repository discovery, shell wrappers, or equivalent duplicate commands. If race is unavailable because of CGO or a missing C compiler, reuse the already successful ordinary test as the fallback and confirm the CI race gate without another command or retry loop. Do not modify files.
            tools: file_tools/read_file,file_tools/read_file_outline,command_tools/run_command,command_tools/start_process,command_tools/process_status,command_tools/stop_process,web_tools/browser_snapshot,web_tools/web_search,web_tools/fetch_url,web_tools/research_snapshot
            max_iterations: "8"
            max_model_calls: "6"
            max_command_calls: "6"
            max_read_calls: "3"
            allowed_command_classes: format,test,build,lint
            approved_plan_scope: "true"
          input:
            audit: stages.audit.outputs.audit
            plan: stages.plan.outputs.plan
            repair: stages.repair.outputs.repair
            request: workflow.input
          outputs:
            verification_report: result.output
            verification: result.verification
            summary: result.summary
          artifacts:
            - name: recovery-verification-report
              kind: verification
              title: Recovery verification report
              ref: result.output
              summary: Regression evidence, full tests, static analysis, infrastructure limits, and residual risks after repair.
          acceptance_criteria:
            - name: has-recovery-verification-result
              ref: result.first_line
              equals: 总体结论：通过
              expected: 复验明确通过后才可验收。
            - name: has-regression-evidence
              ref: result.output
              contains: Regression Evidence
              expected: verification checks the previously blocking defect
            - name: has-full-test-result
              ref: result.output
              contains: Full Test Result
              expected: verification records the final project test outcome
          retry:
            max_attempts: 2
          next:
            - recovery-verification-route
          position:
            x: 3040
            "y": 400
        - name: recovery-verification-route
          node_type: quality_gate
          params:
            stages: recovery-verify
            require_acceptance: "true"
            require_evidence: "true"
            require_verification: "true"
            verification_mode: command
            allow_unknown: "false"
            allowed_infrastructure_failures: go_race_unavailable
          routes:
            pass: recovery-audit
            warning: final-quality
            fail: final-quality
          position:
            x: 3180
            "y": 600
        - name: recovery-audit
          model:
            max_tokens: 1400
          node_type: skill
          agent: auditor
          skill: code-audit
          params:
            max_total_model_calls: "4"
            require_workspace_mutation: "false"
