kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: customer-support-triage
title: Customer Support Triage
description: Classify a support request, gather required context, draft a response, and review customer-facing quality.
category: support
tags:
    - support
    - triage
    - handoff
    - input_gate
    - quality_gate
stages: 11
graph:
    name: customer-support-triage
    description: Support workflow with ticket context extraction, Privacy Check, Escalation Policy, Reviewer Quorum, response drafting, review, and quality-gated customer handoff.
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - triage
          position:
            x: 60
            "y": 240
        - name: triage
          node_type: agent
          agent: planner
          skill: execution-plan
          params:
            output_contract: Emit sections named Summary, Ticket Context, Product Area, Priority, SLA, Customer Impact, Known Facts, Source Attribution, Privacy Flags, Escalation Policy, Missing Context, Suggested Response Plan, and Next Steps.
            purpose: Classify the customer request, extract ticket context, identify privacy/security/legal/billing/SLA escalation, and identify missing context before drafting a response. Use python_notes/support_case_summary when a local ticket file is available.
            tools: python_notes/support_case_summary
          outputs:
            summary: result.summary
            triage: result.output
          artifacts:
            - name: support-triage
              kind: triage
              title: Support triage
              ref: result.output
              summary: Support issue classification and response plan.
          acceptance_criteria:
            - name: has-priority
              ref: result.output
              contains: Priority
              expected: triage assigns priority
            - name: has-product-area
              ref: result.output
              contains: Product Area
              expected: triage identifies product or service area
            - name: has-impact
              ref: result.output
              contains: Impact
              expected: triage explains customer impact
            - name: has-escalation-policy
              ref: result.output
              contains: Escalation Policy
              expected: triage records escalation decision or blocker
            - name: has-next-steps
              ref: result.output
              contains: Next Steps
              expected: triage includes actionable next steps
          next:
            - needs-context
          position:
            x: 330
            "y": 220
        - name: needs-context
          node_type: condition
          agent: ""
          skill: ""
          condition: contains(stages.triage.outputs.triage, "Missing Context")
          routes:
            "false": draft-response
            "true": collect-context
          position:
            x: 630
            "y": 240
        - name: collect-context
          node_type: input_gate
          agent: ""
          skill: ""
          params:
            fields_json: '{"fields":[{"name":"customer_context","type":"textarea","label":"Customer context","required":true},{"name":"account_tier","type":"select","label":"Account tier","options":["unknown","free","pro","enterprise"],"default":"unknown"},{"name":"sla","type":"select","label":"SLA / priority","options":["unknown","standard","business","enterprise","incident"],"default":"unknown"},{"name":"privacy_approved","type":"checkbox","label":"Privacy reviewed","default":false},{"name":"known_workaround","type":"textarea","label":"Known workaround"}]}'
            manual: "true"
            prompt: Provide missing customer context before drafting the support response.
          outputs:
            account_tier: params.account_tier
            customer_context: params.customer_context
            known_workaround: params.known_workaround
            privacy_approved: params.privacy_approved
            sla: params.sla
          next:
            - draft-response
          position:
            x: 930
            "y": 130
        - name: draft-response
          node_type: skill
          agent: chat
          skill: execution-plan
          params:
            output_contract: Emit sections named Customer Reply, Internal Notes, Follow-up Questions, Escalation Notes, Privacy Check, Source Attribution, and Next Actions.
            purpose: Draft a concise customer-facing response and an internal next-action checklist. Separate customer-visible wording from internal notes and do not expose secrets or unsupported promises.
          input:
            customer_context: stages.collect-context.outputs.customer_context
            known_workaround: stages.collect-context.outputs.known_workaround
            triage: stages.triage.outputs.triage
          outputs:
            response: result.output
            summary: result.summary
          artifacts:
            - name: customer-response-draft
              kind: response
              title: Customer response draft
              ref: result.output
              summary: Draft response and internal follow-up notes.
          acceptance_criteria:
            - name: has-customer-reply
              ref: result.output
              contains: Customer Reply
              expected: draft contains a customer-facing reply
            - name: has-next-actions
              ref: result.output
              contains: Next Actions
              expected: draft contains internal next actions
            - name: has-privacy-check
              ref: result.output
              contains: Privacy Check
              expected: draft records privacy/redaction status
          next:
            - review
          position:
            x: 1230
            "y": 220
        - name: review
          node_type: skill
          agent: auditor
          skill: code-audit
          params:
            output_contract: Emit sections named Review Decision, Missing Information, Privacy Check, Escalation Policy, Reviewer Quorum, Customer Reply Risk, Internal Notes Risk, and Recommendation. Use approved only when ready to send.
            review_scope: Review clarity, unsupported claims, missing caveats, privacy-sensitive details, source attribution, customer/internal note separation, escalation needs, and reviewer quorum. Use python_notes/redaction_check when local ticket or draft files are available.
            tools: python_notes/redaction_check
          input:
            response: stages.draft-response.outputs.response
            triage: stages.triage.outputs.triage
          outputs:
            recommendation: result.summary
            review: result.output
          artifacts:
            - name: support-response-review
              kind: review
              title: Support response review
              ref: result.output
              summary: Review of response accuracy and customer-readiness.
          acceptance_criteria:
            - name: review-decision
              ref: result.output
              contains: Review Decision
              expected: review declares readiness
            - name: risk-reviewed
              ref: result.output
              contains: Risk
              expected: review covers customer-facing risk
            - name: privacy-reviewed
              ref: result.output
              contains: Privacy Check
              expected: review records privacy and redaction decision
            - name: reviewer-quorum-reviewed
              ref: result.output
              contains: Reviewer Quorum
              expected: review records reviewer quorum status
          next:
            - quality
          position:
            x: 1530
            "y": 220
        - name: quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            min_score: "75"
            reason: support response is missing ticket context, product area, customer impact, SLA/priority, Privacy Check, Escalation Policy, Reviewer Quorum, or response evidence
            require_acceptance: "true"
            require_evidence: "true"
          routes:
            fail: revise
            pass: handoff
            warning: manager-check
          position:
            x: 1830
            "y": 240
        - name: manager-check
          node_type: checkpoint
          agent: ""
          skill: ""
          params:
            prompt: Review warning-level support response before handoff, including Privacy Check, Escalation Policy, and Reviewer Quorum status.
          next:
            - handoff
          position:
            x: 2110
            "y": 130
        - name: handoff
          node_type: skill
          agent: chat
          skill: execution-plan
          params:
            output_contract: Emit sections named Customer Reply, Internal Notes, Escalation Decision, Privacy Status, Reviewer Quorum, Source Attribution, Remaining Risks, and Next Steps.
          input:
            response: stages.draft-response.outputs.response
            review: stages.review.outputs.review
          outputs:
            final_response: result.output
          artifacts:
            - name: support-handoff
              kind: report
              title: Support handoff
              ref: result.output
          next:
            - end
          position:
            x: 2400
            "y": 130
        - name: revise
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            output_contract: Emit sections named Revision Required, Blocking Issues, Missing Information, Privacy Gaps, Escalation Gaps, Reviewer Quorum Gaps, and Safe Response Plan.
          input:
            failures: stages.quality.outputs.failures
            review: stages.review.outputs.review
          outputs:
            revision_plan: result.output
          next:
            - end
          position:
            x: 2110
            "y": 370
        - name: end
          node_type: end
          agent: ""
          skill: ""
          position:
            x: 2690
            "y": 240
