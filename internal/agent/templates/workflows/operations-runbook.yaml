kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: operations-runbook
title: 受控运维执行
description: 默认用一次分析完成诊断、干跑或变更方案；只有明确请求执行时才进入审批、变更、后检和恢复。
category: operations
tags:
    - operations
    - evidence
    - rollback
    - quality_gate
    - approval
stages: 10
graph:
    name: operations-runbook
    description: 精简运维流程。普通任务一次完成交付，显式 execute_change=true 才进入受控执行闭环。
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next: [prepare]
          position: {x: 60, "y": 240}

        - name: prepare
          node_type: skill
          agent: operations-specialist
          skill: controlled-operations
          model:
            provider: primary
            max_tokens: 3200
            temperature: 0.0
          execution:
            mode: dry_run
            risk_level: medium
            boundary: selected-execution-target
          params:
            max_model_calls: "4"
            max_total_model_calls: "6"
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            purpose: 完成最小只读取证，并直接产出用户要求的诊断报告、干跑、离线恢复清单或受控变更方案。普通任务到此结束，不进入执行节点。
            output_contract: 中文输出必须区分目标与授权、基线证据、结论或预期差异、精确动作、后检查、回滚、停止条件、未验证项和证据引用。没有真实工具证据的动作必须标为未执行。用户指定工作区交付路径时，只读取必要输入，写入该路径并读回校验。
            delivery_rule: 只使用完成当前请求必需的最少工具。不得浏览无关目录、读取运行时状态、重复诊断或修改输入。目录不是文件，绝不能把 deliverables、input、workspace 或任何目录传给 read_file；只读取请求中明确给出的具体文件。请求使用输入配置、日志或快照时，仅读取请求明确提供的实际文件路径；缺少路径时报告缺失输入，不猜测文件名；请求已经提供内联材料时不得猜测任何外部文件名。报告任务按需读取明确输入、写入指定报告并读回同一路径；不得创建哈希临时文件、暂存文件或额外交付物，不得调用删除工具。新建报告首次 write_file 只传 path 和 content。
            execution_rule: 请求没有逐字包含 execute_change=true 时只能诊断、规划或干跑，不调用任何变更、恢复或真实设备应用工具。请求要求只读取指定输入或声明使用既有证据时，本阶段只允许 file_tools/read_file、file_tools/write_file，以及明确要求 Windows JSON 离线方案时使用只读的 host_tools/plan_windows_json_change；不调用其他 host、SSH 或 network 工具。
            tools: file_tools/read_file,file_tools/read_files,file_tools/read_file_outline,file_tools/write_file,host_tools/host_diagnostic_snapshot,host_tools/host_facts,host_tools/disk_usage,host_tools/list_ports,host_tools/list_processes,host_tools/service_status,host_tools/read_log_tail,host_tools/inspect_managed_json,host_tools/plan_windows_json_change,ssh_tools/ssh_host_key_scan,ssh_tools/ssh_run_command,network_tools/device_discovery_plan,network_tools/device_command_plan,network_tools/device_batch_command_plan,network_tools/device_config_dry_run,web_tools/web_search,web_tools/fetch_url,web_tools/research_snapshot
            max_iterations: "8"
          input:
            request: workflow.input
          retry:
            max_attempts: 3
          context:
            include: [workflow.input]
            exclude: [raw_tool_logs, unrelated_session_history]
            max_tokens: 3000
            prompt_max_tokens: 6200
          outputs:
            package: result.output
            observations: result.tool_results
            summary: result.summary
          artifacts:
            - name: operations-package
              kind: evidence
              title: 运维交付与证据
              ref: result.output
              summary: 目标、基线、诊断或干跑、后检、回滚、停止条件和证据引用。
          acceptance_criteria:
            - name: evidence-recorded
              ref: result.tool_results
              contains: '"tool_name":"file_tools/write_file"'
              expected: 报告已经通过工作区文件工具持久化
            - name: delivery-readback
              ref: result.tool_results
              contains: '"tool_name":"file_tools/read_file"'
              expected: 输入或交付物已经通过文件工具读取校验
          next: [quality]
          position: {x: 360, "y": 220}

        - name: quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            stages: prepare
            min_score: "75"
            reason: 运维交付缺少证据、目标边界、后检查、回滚或停止条件
            require_acceptance: "true"
            require_evidence: "true"
          routes:
            fail: end
            pass: execution-requested
            warning: end
          position: {x: 690, "y": 240}

        - name: execution-requested
          node_type: condition
          agent: ""
          skill: ""
          condition: contains(workflow.input, "execute_change=true")
          routes:
            "false": end
            "true": operator-check
          position: {x: 1010, "y": 210}

        - name: operator-check
          node_type: checkpoint
          agent: ""
          skill: ""
          execution:
            mode: manual
            risk_level: high
            boundary: selected-target-change
          params:
            prompt: 核对目标身份、授权、当前基线、精确差异、回滚引用和后检标准后，再批准执行。
          next: [execute]
          position: {x: 1320, "y": 150}

        - name: execute
          node_type: skill
          agent: operations-specialist
          skill: controlled-operations
          model:
            provider: primary
            max_tokens: 2200
            temperature: 0.0
          execution:
            mode: manual
            risk_level: high
            boundary: selected-target-change
            requires_approval: true
          params:
            max_model_calls: "8"
            max_total_model_calls: "12"
            require_workspace_mutation: "false"
            purpose: 重新读取变更前状态，只执行已审批的最小动作；发现漂移立即停止。
            output_contract: 使用中文输出“执行前复核、批准动作、实际差异、工具证据、执行结果、恢复引用、未执行项”。
            tools: host_tools/inspect_managed_json,host_tools/set_managed_json_value,network_tools/device_config_dry_run,network_tools/device_restconf_live_apply,ssh_tools/ssh_host_key_scan,ssh_tools/ssh_run_command
            max_iterations: "5"
          input:
            request: workflow.input
            plan: stages.prepare.outputs.package
          context:
            include: [workflow.input, stages.prepare.outputs.package]
            exclude: [raw_tool_logs, unrelated_session_history]
            max_tokens: 3200
            prompt_max_tokens: 6800
          outputs:
            execution: result.output
            changes: result.changes
            tool_results: result.tool_results
          next: [verify]
          position: {x: 1620, "y": 150}

        - name: verify
          node_type: skill
          agent: operations-specialist
          skill: controlled-operations
          model:
            provider: primary
            max_tokens: 1800
            temperature: 0.0
          execution:
            mode: planning
            risk_level: medium
            boundary: selected-target-post-check
          params:
            max_model_calls: "6"
            max_total_model_calls: "8"
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            purpose: 用独立只读调用核对变更后的实际状态，不能只相信执行摘要。
            output_contract: 使用中文输出“后检证据、预期与实际、回归检查、验证状态、失败证据、恢复决定”。
            tools: host_tools/host_diagnostic_snapshot,host_tools/host_facts,host_tools/service_status,host_tools/inspect_managed_json,ssh_tools/ssh_host_key_scan,ssh_tools/ssh_run_command,network_tools/device_discovery_plan,network_tools/device_command_plan,web_tools/web_search,web_tools/fetch_url,web_tools/research_snapshot
            max_iterations: "4"
          input:
            request: workflow.input
            before: stages.prepare.outputs.package
            execution: stages.execute.outputs.execution
          context:
            include: [workflow.input, stages.prepare.outputs.package, stages.execute.outputs.execution]
            exclude: [raw_tool_logs, unrelated_session_history]
            max_tokens: 3600
            prompt_max_tokens: 7200
          outputs:
            verification: result.output
            status: result.verification
          acceptance_criteria:
            - name: post-check-recorded
              ref: result.output
              contains: 后检证据
              expected: 记录真实变更后证据
            - name: verification-declared
              ref: result.output
              contains: 验证状态
              expected: 明确声明通过或失败
          next: [post-quality]
          position: {x: 1920, "y": 150}

        - name: post-quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            stages: verify
            min_score: "80"
            reason: 后检失败或缺少独立证据
            require_acceptance: "true"
            require_evidence: "true"
          routes:
            fail: recover
            pass: end
            warning: recover
          position: {x: 2220, "y": 210}

        - name: recover
          node_type: skill
          agent: operations-specialist
          skill: controlled-operations
          model:
            provider: primary
            max_tokens: 1800
            temperature: 0.0
          execution:
            mode: manual
            risk_level: high
            boundary: selected-target-recovery
            requires_approval: true
          params:
            max_model_calls: "4"
            max_total_model_calls: "6"
            require_workspace_mutation: "false"
            purpose: 只使用准备阶段记录的恢复引用恢复，检测到漂移或缺少引用时停止。
            output_contract: 使用中文输出“恢复触发、恢复动作、审批证据、恢复状态、恢复验证、剩余风险”。
            tools: host_tools/inspect_managed_json,host_tools/restore_managed_json_change,network_tools/device_restconf_live_apply,ssh_tools/ssh_host_key_scan,ssh_tools/ssh_run_command
            max_iterations: "4"
          input:
            request: workflow.input
            plan: stages.prepare.outputs.package
            execution: stages.execute.outputs.execution
            verification: stages.verify.outputs.verification
          context:
            include: [workflow.input, stages.prepare.outputs.package, stages.execute.outputs.execution, stages.verify.outputs.verification]
            exclude: [raw_tool_logs, unrelated_session_history]
            max_tokens: 4000
            prompt_max_tokens: 7600
          outputs:
            recovery: result.output
            verification: result.verification
          next: [end]
          position: {x: 2500, "y": 350}

        - name: end
          node_type: end
          agent: ""
          skill: ""
          position: {x: 2800, "y": 220}
