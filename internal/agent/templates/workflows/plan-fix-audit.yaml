kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: plan-fix-audit
title: 规划、修复、验证与审计
description: 先澄清范围并制定计划，再实施已批准改动、验证并审查证据，由质量门禁决定交付、人工复核或返工。
category: software
tags:
    - golden-reference
    - golden-scenario-1
    - coding
    - audit
    - approval
    - quality_gate
    - evidence
stages: 11
graph:
    name: plan-fix-audit
    description: Plan a requested change, implement approved work, verify the result, pass an evidence-backed quality gate, and produce an audit-ready output.
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - intake
          position:
            x: 80
            "y": 260
        - name: intake
          node_type: agent
          agent: planner
          skill: execution-plan
          params:
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            output_contract: Emit sections named Goal, Affected Files, Constraints, Acceptance Checks, Risks, and Open Questions.
            purpose: Compile the user request into a concise task contract without inspecting the workspace or calling tools.
            risk_scope: Identify workspace, dependency, test, approval, and rollback risks before planning edits.
            max_iterations: "1"
          outputs:
            goal: result.summary
            intake_report: result.output
            risks: result.findings
          artifacts:
            - name: intake-report
              kind: report
              title: Intake report
              ref: result.output
              summary: Clarified objective, affected files, constraints, acceptance checks, risks, and open questions.
          acceptance_criteria:
            - name: has-goal
              ref: result.output
              exists: true
              expected: intake names the requested outcome
            - name: has-acceptance-checks
              ref: result.output
              exists: true
              expected: intake defines how success will be checked
            - name: has-risks
              ref: result.output
              exists: true
              expected: intake records implementation and approval risks
          next:
            - plan
          position:
            x: 360
            "y": 220
        - name: plan
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            output_contract: Emit sections named Implementation Steps, Target Files, Verification Commands, Rollback Notes, and Handoff.
            purpose: Produce an implementation plan that the fixer can execute without rediscovering the task.
            max_iterations: "3"
            max_read_calls: "2"
          input:
            intake: stages.intake.outputs.intake_report
            request: workflow.input
          outputs:
            plan: result.output
            summary: result.summary
          artifacts:
            - name: implementation-plan
              kind: report
              title: Implementation plan
              ref: result.output
              summary: Ordered steps, target files, verification commands, rollback notes, and handoff guidance.
          acceptance_criteria:
            - name: has-steps
              ref: result.output
              exists: true
              expected: plan contains ordered implementation steps
            - name: has-target-files
              ref: result.output
              exists: true
              expected: plan names likely files or areas
            - name: has-verification
              ref: result.output
              exists: true
              expected: plan declares verification commands or checks
          context:
            include:
                - memory.project
                - previous.summary
                - stages.intake.outputs.intake_report
            exclude:
                - raw_tool_logs
                - large_file_contents
            max_tokens: 3500
            prompt_max_tokens: 5600
            request_max_tokens: 1200
            inputs_max_tokens: 1500
            parameters_max_tokens: 750
            retrieval:
                enabled: true
                query: "{{input.goal}}"
          next:
            - implement
          position:
            x: 720
            "y": 220
        - name: implement
          node_type: agent
          agent: fixer
          skill: code-writing
          params:
            require_workspace_mutation: "false"
            worker_contract: engineering_v1
            output_contract: Return compact JSON with summary, changed_files, evidence, verification, blockers, and next_actions. Keep detailed notes in the implementation artifact.
            edit_policy: Apply the approved plan with focused code changes, preserve user edits, and keep unrelated files untouched.
            contract_policy: The original workflow request is authoritative. Preserve every API, type signature, file constraint, and acceptance condition unless the request explicitly authorizes changing it.
            verification_scope: Run gofmt -w on changed Go files, go test -count=1 ./..., and go vet ./.... Do not run go test -race or request CGO environment variables unless the original request explicitly requires the race detector.
            max_command_calls: "4"
            max_read_calls: "3"
          input:
            plan: stages.plan.outputs.plan
            intake: stages.intake.outputs.intake_report
            request: workflow.input
          outputs:
            changed_files: result.changed_files
            changes: result.changes
            verification: result.verification
            blockers: result.blockers
            next_actions: result.next_actions
            summary: result.summary
            implementation_report: result.output
          artifacts:
            - name: implementation-report
              kind: report
              title: Implementation report
              ref: result.output
              summary: Files changed, verification notes, and residual implementation risk.
          acceptance_criteria:
            - name: has-change-summary
              ref: result.output
              exists: true
              expected: implementation reports what changed
            - name: has-files-changed
              ref: result.output
              exists: true
              expected: implementation lists changed files or explains none
          retry:
            max_attempts: 2
          approval: true
          context:
            include:
                - previous.summary
                - previous.artifacts.implementation-plan
                - stages.plan.outputs.plan
                - files.changed
            exclude:
                - raw_tool_logs
                - unrelated_session_history
            max_tokens: 4200
            prompt_max_tokens: 5200
            request_max_tokens: 800
            inputs_max_tokens: 1700
            parameters_max_tokens: 700
          next:
            - verify
          position:
            x: 1080
            "y": 220
        - name: verify
          node_type: skill
          agent: auditor
          skill: code-audit
          approval: true
          params:
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            use_change_slice_scheduler: "false"
            output_contract: Emit sections named Verification Result, Commands Run, Failures, Coverage, and Residual Risk.
            verification_command: go test ./...
            evidence: Include exact commands or checks performed. If a command was not run, explain why.
            approved_plan_scope: "true"
            verification_scope: Run only go test ./..., go vet ./..., and gofmt -l on changed Go files. Do not run go test -race unless the user explicitly requires it. For gofmt use program gofmt with -l and file arguments, without a redundant fmt argument. Reuse implementation evidence and stop after these checks.
            max_iterations: "5"
            max_command_calls: "3"
            max_read_calls: "1"
          input:
            changes: stages.implement.outputs.summary
            changed_files: stages.implement.outputs.changed_files
            implementation_verification: stages.implement.outputs.verification
            plan: stages.plan.outputs.plan
            request: workflow.input
          outputs:
            verification: result.output
            summary: result.summary
          artifacts:
            - name: verification-report
              kind: verification
              title: Verification report
              ref: result.output
              summary: Commands, checks, failures, coverage, and residual risk.
          acceptance_criteria:
            - name: verification-result
              ref: result.output
              exists: true
              expected: verification declares pass, fail, warning, or not-run
            - name: commands-recorded
              ref: result.output
              exists: true
              expected: verification lists exact commands or explains why none ran
          context:
            include:
                - previous.summary
                - previous.artifacts.implementation-report
                - stages.implement.outputs.changed_files
                - stages.implement.outputs.verification
            exclude:
                - raw_tool_logs
            max_tokens: 3600
            prompt_max_tokens: 4800
            request_max_tokens: 700
            inputs_max_tokens: 1500
            parameters_max_tokens: 650
          next:
            - audit
          position:
            x: 1440
            "y": 220
        - name: audit
          node_type: skill
          agent: auditor
          skill: code-audit
          approval: true
          params:
            require_workspace_mutation: "false"
            use_change_slice_scheduler: "false"
            output_contract: Emit sections named Findings, Severity Order, Missed Requirements, Test Gaps, Safety Notes, and Recommendation.
            severity_order: Prioritize concrete bugs and risks before summaries.
            approved_plan_scope: "true"
            evidence_policy: Review the supplied plan, implementation report, changed files, and verification evidence. Do not rerun commands or rediscover the workspace unless a specific evidence gap prevents a conclusion.
            max_iterations: "2"
            max_command_calls: "1"
            max_read_calls: "1"
          input:
            implementation: stages.implement.outputs.summary
            changed_files: stages.implement.outputs.changed_files
            verification: stages.verify.outputs.verification
            plan: stages.plan.outputs.plan
            request: workflow.input
          outputs:
            audit: result.output
            findings: result.findings
            summary: result.summary
          artifacts:
            - name: audit-report
              kind: report
              title: Audit report
              ref: result.output
              summary: Severity-ordered findings, missed requirements, safety notes, test gaps, and recommendation.
          acceptance_criteria:
            - name: has-findings
              ref: result.output
              exists: true
              expected: audit includes findings or explicitly says none found
            - name: has-recommendation
              ref: result.output
              exists: true
              expected: audit gives a concrete recommendation
          context:
            include:
                - previous.summary
                - previous.artifacts.verification-report
                - stages.implement.outputs.changed_files
                - stages.implement.outputs.blockers
                - stages.verify.outputs.verification
            exclude:
                - raw_tool_logs
            max_tokens: 4000
            prompt_max_tokens: 5000
            request_max_tokens: 700
            inputs_max_tokens: 1600
            parameters_max_tokens: 650
          next:
            - quality
          position:
            x: 1800
            "y": 220
        - name: quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            stages: implement,verify,audit
            min_score: "80"
            reason: implementation, verification, or audit evidence is missing or below the release bar
            require_acceptance: "true"
            require_evidence: "true"
            require_verification: "true"
            verification_mode: command
            allow_unknown: "false"
            allowed_infrastructure_failures: go_race_unavailable
          routes:
            pass: final-handoff
            warning: operator-review
            fail: revise
          position:
            x: 2160
            "y": 220
        - name: operator-review
          node_type: checkpoint
          agent: ""
          skill: ""
          params:
            prompt: The quality gate passed with warnings. Review the plan, implementation, verification, and audit artifacts before final handoff.
          next:
            - final-handoff
          position:
            x: 2520
            "y": 80
        - name: revise
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            output_contract: Emit sections named Revision Plan, Blocking Issues, Required Evidence, and Next Action.
            purpose: Explain what must change before this workflow can be accepted.
            max_iterations: "1"
          input:
            audit: stages.audit.outputs.audit
            verification: stages.verify.outputs.verification
            quality_status: stages.quality.outputs.quality_status
            failures: stages.quality.outputs.failures
            request: workflow.input
          outputs:
            revision_plan: result.output
            summary: result.summary
          artifacts:
            - name: revision-plan
              kind: report
              title: Revision plan
              ref: result.output
              summary: Blocking issues, missing evidence, and next action after a failed quality gate.
          next:
            - final-handoff
          position:
            x: 2520
            "y": 360
        - name: final-handoff
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            require_workspace_mutation: "false"
            docs_policy: When public technical docs are requested, use public queries and URLs with web_search, fetch_url or research_snapshot as needed; record source URL, product/version and fetched_at time. Honor local-only, offline and supplied-evidence-only requests without Internet calls. Never upload private logs, credentials, configuration, source code or incident evidence to public services. Fresh docs do not authorize target scanning, host access or modifications.
            output_contract: Emit sections named Final Status, Delivered Changes, Verification Evidence, Audit Summary, Remaining Risks, and Next Steps.
            purpose: Produce a concise user-facing handoff whether the workflow passed, needs operator review, or requires revision.
            evidence_policy: Synthesize only the supplied stage outputs. Do not call tools or repeat workspace inspection.
            max_iterations: "1"
          input:
            audit: stages.audit.outputs.audit
            implementation: stages.implement.outputs.implementation_report
            plan: stages.plan.outputs.plan
            quality_status: stages.quality.outputs.quality_status
            request: workflow.input
            revision_plan: stages.revise.outputs.revision_plan
            verification: stages.verify.outputs.verification
          outputs:
            final_report: result.output
            summary: result.summary
          artifacts:
            - name: final-handoff-report
              kind: report
              title: Final handoff report
              ref: result.output
              summary: Final status, delivered changes, verification evidence, audit summary, risks, and next steps.
          acceptance_criteria:
            - name: has-final-status
              ref: result.output
              exists: true
              expected: final handoff declares the outcome
            - name: has-verification-evidence
              ref: result.output
              exists: true
              expected: final handoff includes verification evidence or the reason it is missing
            - name: has-next-steps
              ref: result.output
              exists: true
              expected: final handoff gives concrete next steps
          context:
            include:
                - previous.summary
                - previous.artifacts.audit-report
                - previous.artifacts.verification-report
                - previous.artifacts.revision-plan
                - stages.audit.outputs.audit
                - stages.implement.outputs.changed_files
                - stages.verify.outputs.verification
                - stages.revise.outputs.revision_plan
                - files.changed
            exclude:
                - raw_tool_logs
                - large_file_contents
            max_tokens: 4200
            prompt_max_tokens: 5200
            request_max_tokens: 700
            inputs_max_tokens: 1600
            parameters_max_tokens: 650
          next:
            - output
          position:
            x: 2880
            "y": 220
        - name: output
          node_type: end
          agent: ""
          skill: ""
          position:
            x: 3240
            "y": 240
