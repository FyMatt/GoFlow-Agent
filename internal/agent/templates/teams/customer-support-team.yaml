kind: goflow.team_template_resource
version: 2
min_supported_version: 1
name: customer-support-team
title: Customer Support Team
category: support
description: Triage, context gathering, response drafting, and customer-readiness review pattern.
tags: [support, triage, response, handoff]
recommended_workflow: customer-support-triage
recommended_entry_agent: chat
role_templates:
  - name: triage-lead
    label: Triage Lead
    agent: planner
    skill: execution-plan
    responsibilities:
      - classify the customer request
      - extract ticket context, product area, customer impact, and SLA signals
      - identify priority and impact
      - list missing context
    tools: [python_notes/support_case_summary]
    produces: [triage, priority, missing_context]
  - name: context-researcher
    label: Context Researcher
    agent: chat
    skill: execution-plan
    responsibilities:
      - collect workspace or knowledge-base context
      - separate facts from assumptions
      - summarize relevant constraints
      - preserve source attribution for read-only lookup evidence
    consumes: [triage, missing_context]
    produces: [known_facts, context_summary]
  - name: response-writer
    label: Response Writer
    agent: chat
    skill: execution-plan
    responsibilities:
      - draft a concise customer-facing response
      - include next steps
      - avoid unsupported promises
      - separate customer-facing text from internal notes
    consumes: [triage, known_facts]
    produces: [customer_reply, internal_notes]
  - name: support-reviewer
    label: Support Reviewer
    agent: auditor
    skill: code-audit
    responsibilities:
      - review clarity and accuracy
      - flag privacy or escalation risk
      - run redaction checks before customer-visible handoff
      - enforce reviewer quorum for high-impact, SLA, legal, refund, privacy, or security cases
      - approve or request revision
    tools: [python_notes/redaction_check]
    consumes: [customer_reply, internal_notes]
    produces: [review_decision, risk_notes]
handoffs:
  - from: triage-lead
    to: context-researcher
    kind: context_request
    subject: Support context needed
    artifacts: [triage, missing_context]
    blackboard: [request, evidence]
  - from: context-researcher
    to: response-writer
    kind: response_context
    subject: Known facts for response
    artifacts: [known_facts, context_summary]
    blackboard: [evidence, decision]
  - from: response-writer
    to: support-reviewer
    kind: review_request
    subject: Customer reply ready for review
    artifacts: [customer_reply, internal_notes]
    blackboard: [finding, decision]
blackboard_templates:
  - kind: request
    title: Original request and constraints
    owner_role: triage-lead
    status: open
    tags: [scope]
    description: The user request, allowed scope, and assumptions that should survive handoffs.
  - kind: plan
    title: Working plan
    owner_role: triage-lead
    status: open
    tags: [plan]
    description: Current executable plan, stage ordering, and known blockers.
  - kind: evidence
    title: Evidence and observations
    owner_role: triage-lead
    status: open
    tags: [evidence]
    description: Tool observations, source references, test output, or collected artifacts.
  - kind: decision
    title: Decisions and approvals
    owner_role: triage-lead
    status: open
    tags: [decision]
    description: Decisions made by agents or the operator, including approval gates.
  - kind: finding
    title: Findings and risks
    owner_role: triage-lead
    status: open
    tags: [risk]
    description: Bugs, vulnerabilities, regressions, or unresolved questions.
quorum_presets:
  - name: support-review
    title: Support reviewer approval
    description: Require reviewer approval before sending a customer-facing response.
    required: 1
    roles: [support-reviewer]
    reject_blocks: true
    default: true
  - name: triage-and-review
    title: Triage plus review approval
    description: Require both triage and support review approval for high-impact issues.
    required: 2
    roles: [triage-lead, support-reviewer]
    reject_blocks: true
output_contract: [triage, known_facts, customer_reply, review_decision, risk_notes]
