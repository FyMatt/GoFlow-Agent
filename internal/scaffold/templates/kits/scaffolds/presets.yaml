presets:
  - name: multi-domain-agent
    default_kit_name: multi-domain-agent-kit
    title: Multi-Domain Agent Starter Kit
    description: One starter kit that decomposes mixed user requests, runs selected domain workers in parallel, and joins them into an audited handoff.
    category: starter
    tags: [starter, multi-domain, workflow, team, quality]
    providers: [primary]
    agents: [chat, planner, fixer, auditor, software-engineer, security-researcher, web-security-researcher, binary-analyst, documentation-specialist, research-specialist, source-verifier, operations-specialist, support-specialist, framework-extension-architect]
    skills: [execution-plan, code-writing, code-audit, vulnerability-research, web-vulnerability-research, authorized-red-team-validation, binary-vulnerability-research, internet-research, source-verification, office-document-production, reverse-engineering]
    tools: [file_tools/read_file, file_tools/search_files, file_tools/write_file, web_tools/web_search, web_tools/fetch_url, web_tools/research_snapshot, web_tools/compile_research_evidence, web_tools/fetch_page_assets, web_tools/browser_snapshot, web_tools/browser_probe_points, office_tools/office_capabilities, office_tools/create_docx, office_tools/create_xlsx, office_tools/create_pptx, office_tools/create_pdf, office_tools/inspect_office_document, office_tools/validate_office_document, office_tools/replace_office_text, office_tools/fill_office_template, office_tools/export_office_pdf, office_tools/render_office_preview, network_tools/device_discovery_plan, network_tools/device_command_plan, network_tools/device_batch_command_plan, network_tools/device_config_dry_run, network_tools/device_restconf_live_apply, python_notes/binary_file_info, python_notes/binary_strings, python_notes/hex_preview, python_notes/binary_format_summary, python_notes/binary_entropy_map, python_notes/binary_symbol_hints, python_notes/binary_extract_window, python_notes/markdown_link_check, python_notes/support_case_summary, python_notes/redaction_check]
    workflows: [plan-fix-audit, skill-chain]
    workflow_templates: [multi-domain-intake-router, complex-project-delivery, task-decomposition-plan, plan-fix-audit, software-quality-gate, software-team-review-gate, web-research-risk, parallel-research-review, security-audit-evidence-gate, authorized-red-team-validation, binary-triage, docs-review-publish, operations-runbook, customer-support-triage, agent-framework-extension]
    team_templates: [software-task-team, audit-security-team, web-research-team, internet-research-team, binary-triage-team, documentation-team, operations-runbook-team, customer-support-team, framework-extension-team]
    policy_rules: [expression, contains, risk_at_least, ref_truthy, team_approval_gate]
    required_env: [GOFLOW_API_KEY]
    recommended_workflow: multi-domain-intake-router
    recommended_agent: chat
    examples:
      - title: Route a mixed request
        description: Collect context, decompose into bounded domain slices, run selected workers in parallel, and produce a quality-gated handoff.
        request: Help me decide how to handle this project request and route it to the right workflow.
        workflow: multi-domain-intake-router
        agent: chat
    vertical_pack:
      domain: multi-domain
      maturity: production-ready
      summary: Routes mixed user requests through structured intake, branch-selection contracts, max-parallel limits, per-branch tool allowlists, cost attribution, selected parallel domain workers, artifact-first join, conflict detection, audit, quality gate, and final integrated risk handoff.
      supported_tasks: [domain routing, task intake, task decomposition, selected parallel domain execution, branch-selection diagnostics, max-parallel orchestration, per-branch tool allowlist enforcement, authorized red-team validation routing, team handoff, starter kit selection, operations device planning handoff, artifact handoff and conflict detection, multi-domain report synthesis]
      required_inputs: [primary domain or auto routing, user goal, target context, desired output, risk tolerance, maximum parallel domains, branch selection policy]
      tool_boundaries:
        - Uses only selected domain worker tools and linked team template refs.
        - Unselected domain workers do not run, reducing token and tool exposure.
        - Each selected branch must carry branch-selection reason, per-branch tool allowlist, budget and cost attribution, and artifact handoff contract.
        - Keeps decomposition, worker handoffs, join, audit, and synthesis summary-first.
        - Network-device work is routed to operations tools with authorized scope, host allowlists, dry-run plans, live RESTCONF readiness, and evidence refs.
        - Offensive security work is routed to authorized red-team validation with written scope, allowlists, approvals, rate limits, and blocked-action reporting.
      safety_gates:
        - Route risky domains to approval-aware workflows.
        - Require explicit authorization and scope for security, web, operations, and binary analysis work.
        - Keep offensive validation non-destructive, scoped, and approval-gated.
        - Block joins when selected worker artifacts are missing or cross-domain conflicts are unresolved.
        - Preserve unresolved decisions for operator review.
      quality_gates:
        - Requires decomposition with selected active branches.
        - Requires branch-selection reason, pruned branch list, max-parallel decision, and per-branch allowlist.
        - Requires selected worker summaries or explicit blockers.
        - Requires artifact handoff, join conflict diagnostics, integrated report, audit decision, token and cost discipline, and risk handoff.
      evidence_artifacts: [intake summary, multi-domain task graph, branch-selection reason, pruned branches, per-branch tool allowlists, selected domain worker reports, authorized red-team validation report, integrated multi-domain report, join conflict report, audit report, device plan refs, live connector audit refs, final handoff report]
      presentation_guidance:
        - Show goal, target, desired output, risk tolerance, selected and pruned domains, branch blockers, approvals, quality status, join conflicts, and final handoff.
        - Show active_branches, branch_selection_reason, pruned_branches, per_branch_tool_allowlists, branch contracts, team refs, policy refs, model routes, context budgets, cost attribution, artifact refs, conflicts, and audit evidence.
      token_strategy:
        - Route with compact intake fields.
        - Use strong-model decomposition once, then run only selected domain workers.
        - Pass branch contracts, summaries, structured fields, and artifact refs instead of full transcripts.
        - Keep unselected branches out of execution, join, audit, and final handoff.
        - Attribute cost by selected branch and surface budget blockers instead of truncating work.
      model_routes:
        strong: [task decomposition, selected branch arbitration, cross-domain aggregation, final audit synthesis]
        worker: [selected domain worker execution, bounded domain analysis]
        verifier: [quality gate review]
    metadata:
      preset: multi-domain-agent
      recommended_team: framework-extension-team
      primary_skill: execution-plan

  - name: software-engineering
    default_kit_name: software-engineering-kit
    routing:
      version: 1
      match_terms: [软件开发, 编写代码, 开发脚本, 修复代码, 实现功能, 美化页面, 页面样式, software development, implement feature, write script]
      entry_workflow: plan-implement-audit
      required_tools: [file_tools/read_file, file_tools/apply_patch, command_tools/run_command]
    title: Software Engineering Kit
    description: Plan, implement, review, and hand off scoped software changes.
    category: software
    tags: [coding, review, planning]
    providers: [primary]
    agents: [chat, planner, fixer, auditor, software-engineer, quality-engineer]
    skills: [execution-plan, code-writing, code-audit]
    tools: [file_tools/read_file, file_tools/search_files, file_tools/write_file, file_tools/read_file_range, file_tools/apply_patch, command_tools/run_command, command_tools/start_process, command_tools/process_status, command_tools/stop_process, web_tools/web_search, web_tools/fetch_url, web_tools/research_snapshot, web_tools/browser_snapshot]
    workflows: [plan-fix-audit, plan-implement-audit]
    workflow_templates: [complex-project-delivery, plan-fix-audit, software-quality-gate, software-team-review-gate, parallel-research-review]
    team_templates: [software-task-team]
    policy_rules: [expression, team_approval_gate]
    recommended_workflow: plan-fix-audit
    recommended_agent: software-engineer
    examples:
      - title: Improve a project
        description: Plan, edit, and review a code change under approval.
        request: Optimize this project and add focused tests.
        workflow: plan-fix-audit
        agent: software-engineer
    vertical_pack:
      domain: software-engineering
      maturity: production-ready
      summary: Plans, decomposes, implements, verifies, audits, and reports scoped software changes with workspace-scoped file tools, token-bounded context, approval-aware writes, artifact-first evidence, and quality-gated handoff.
      supported_tasks: [scoped implementation, bug fixing, refactoring, test and verification planning, parallel bounded worker delivery, code review handoff]
      required_inputs: [user requirement, target files or project area, acceptance criteria, verification command preference, risk tolerance for writes, confirmed workspace boundary]
      tool_boundaries:
        - Read tools are used for discovery before edits.
        - Write tools require fix-stage scope and approval policy.
        - Exec verification should stay focused and report exact commands.
        - File tools stay inside the confirmed workspace and reject outside-workspace paths.
      safety_gates:
        - Request approval before broad rewrites or risky writes.
        - Keep changes inside the confirmed workspace.
        - Preserve verification failures and unresolved risks for review.
        - Use worker ownership boundaries before parallel writes.
      quality_gates:
        - Requires implementation summary.
        - Requires verification evidence or a stated blocker.
        - Requires audit findings or clean review rationale.
        - Requires artifact refs or compact evidence for worker outputs.
      evidence_artifacts: [implementation plan, changed file summary, verification output, audit report, worker artifact refs, final handoff]
      presentation_guidance:
        - Show task, target area, approval prompts, verification result, and final handoff.
        - Show workflow graph, stage models, allowed tools, context budgets, artifact refs, and retry state.
      token_strategy:
        - Use file summaries and hashes before full file reads.
        - Pass compact stage outputs and artifact refs between stages.
        - Use parallel worker slices only when ownership is bounded.
        - Use artifact refs, changed-file summaries, and verification summaries instead of copying worker transcripts.
      model_routes:
        strong: [task decomposition, architecture tradeoff review, conflict resolution, final audit synthesis]
        worker: [bounded code edits, focused tests, local refactors]
        verifier: [regression review, quality gate evaluation]
    metadata:
      preset: software-engineering
      recommended_team: software-task-team
      primary_skill: code-writing

