    recommended_agent: web-security-researcher
    examples:
      - title: Review a target URL
        description: Fetch reachable assets and produce evidence-backed findings.
        request: Review https://example.com for client-side security risks within authorized scope.
        workflow: web-research-risk
        agent: web-security-researcher
    vertical_pack:
      domain: web-security
      maturity: production-ready
      summary: Collects authorized source and browser-rendered web evidence, classifies client-side risk, and reports defensive findings with approval gates.
      supported_tasks: [authorized web target intake, page and asset collection, browser DOM and form evidence collection, browser probe surface enumeration and approved GET canary validation, client-side XSS and security signal review, authorized red-team attack-path validation, non-destructive PoC and canary verification planning, evidence-backed remediation report]
      required_inputs: [target URL, authorized scope confirmation, allowed hosts, desired evidence depth, active verification approval status, allowed actions and payload constraints for red-team validation]
      tool_boundaries:
        - web_tools/browser_snapshot requires authorized_scope=true and allowed_hosts.
        - web_tools/browser_probe_points requires authorized_scope=true and allowed_hosts, and only runs active GET canary probes when active_probe_approved=true.
        - Browser automation returns compact DOM, form, link, script, signal, screenshot hash, and path summaries instead of full raw evidence by default.
        - Active XSS or SQLi-style probing must be approval-gated, non-destructive, rate-limited, and scoped.
        - Authorized red-team validation uses non-destructive canary evidence and stops when an action exceeds scope.
      safety_gates:
        - Reject browser collection without explicit authorized scope.
        - Require host allowlist before browser automation.
        - Route active probing requests through operator approval and evidence capture.
        - Require written authorization, allowed actions, rate limits, and exclusions before offensive validation.
      quality_gates:
        - Requires target scope.
        - Requires collected source or browser evidence.
        - Requires confirmed vs hypothetical finding separation.
        - Requires remediation and residual uncertainty.
      evidence_artifacts: [target scope, page asset inventory, browser snapshot summary, browser probe-point summary, security signal list, risk report, red-team validation plan, red-team validation evidence, blue-team handoff]
      simple_mode:
        - Show target URL, allowed hosts, authorization checkbox, evidence status, risk level, and final report.
        - Show whether red-team validation is approved, blocked, or complete.
      expert_mode:
        - Show tool allowlists, browser evidence refs, context budgets, approval gates, route conditions, and raw workflow graph.
        - Show authorization boundary, allowed actions, blocked actions, canary evidence, and red/blue handoff refs.
      token_strategy:
        - Keep browser outputs compact with DOM hashes and previews.
        - Store screenshots as artifact paths and hashes instead of injecting image bytes.
        - Pass evidence summaries and artifact refs to audit/report stages.
      model_routes:
        strong: [scope and risk arbitration, active verification decision, red-team validation boundary review, final remediation synthesis]
        worker: [asset collection, browser snapshot collection, probe surface enumeration, authorized canary validation, client-side pattern review]
        verifier: [evidence gate review, finding confidence audit]
    metadata:
      preset: web-security
      recommended_team: web-research-team
      primary_skill: web-vulnerability-research

  - name: security-research
    default_kit_name: security-research-kit
    title: Security Research Kit
    description: Plan authorized security reviews, collect evidence, classify risk, and prepare defensive reports.
    category: security
    tags: [security, audit, evidence, red-team]
    providers: [primary]
    agents: [planner, auditor, security-researcher, web-security-researcher, binary-analyst]
    skills: [execution-plan, vulnerability-research, web-vulnerability-research, authorized-red-team-validation, binary-vulnerability-research, reverse-engineering, code-audit]
