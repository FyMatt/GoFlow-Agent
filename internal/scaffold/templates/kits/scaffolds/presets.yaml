      - title: 核验公开信息
        description: 使用原始来源核验公开说法，并明确冲突和证据缺口。
        request: 核验指定产品最近一次正式发布的日期和主要变化，优先引用官方来源。
        workflow: parallel-research-review
        agent: research-specialist
    vertical_pack:
      domain: internet-research
      maturity: production-ready
      summary: 面向互联网资料搜索、事实核验和多来源对比，交付结论可追溯、冲突可见的多格式研究产物。
      supported_tasks: [公开资料搜索与事实核验, 官方公告和版本信息追踪, 多方案对比研究, 来源冲突和时效检查, 中文多格式研究交付]
      required_inputs: [研究主题, 时间范围, 地域或版本边界, 交付目录]
      tool_boundaries:
        - 搜索结果只用于发现候选来源，不能直接作为结论证据。
        - 批量来源快照最多处理十二个 URL，并自动缓存和去重。
        - 文件工具只写入工作区内的研究交付目录。
      safety_gates:
        - 不登录账户、不绕过付费墙，也不执行主动安全探测。
        - 不把无法访问的页面或未知转载当作已确认事实。
      quality_gates:
        - 每条关键结论必须有直接来源映射。
        - 来源冲突、过期信息和证据缺口不得隐藏。
        - 最终交付必须包含中文 Markdown、JSON 和 CSV 内容。
      evidence_artifacts: [研究范围, 来源快照, 结论来源映射, 来源核验报告, 多格式研究交付包]
      presentation_guidance:
        - 只显示研究主题、时间范围、来源数量、冲突状态、质量结论和产物路径。
        - 在产物详情中按需查看规范 URL、正文哈希、抓取时间和结论来源映射。
      token_strategy:
        - 后续阶段只传递来源摘要、必要摘录、URL、哈希和结论映射。
        - 使用缓存和内容哈希避免重复抓取和重复模型输入。
      model_routes:
        strong: [复杂问题拆解, 冲突裁决, 最终结论表达]
        worker: [搜索, 批量快照, 来源整理, 多格式产物生成]
        verifier: [来源映射核验, 时效和独立性检查]
