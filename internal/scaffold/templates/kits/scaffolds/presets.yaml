      preset: internet-research
      recommended_team: internet-research-team
      primary_skill: internet-research

  - name: web-security
    default_kit_name: web-security-kit
    title: Web Security Research Kit
    description: Collect web assets, review client code evidence, and route risky findings through approval gates.
    category: security
    tags: [web, security, audit, red-team]
    providers: [primary]
    agents: [planner, auditor, web-security-researcher, security-researcher]
    skills: [execution-plan, web-vulnerability-research, vulnerability-research, authorized-red-team-validation, code-audit]
    tools: [web_tools/web_search, web_tools/fetch_url, web_tools/fetch_page_assets, web_tools/browser_snapshot, web_tools/browser_probe_points, file_tools/read_file, file_tools/search_files]
    workflows: [skill-chain]
    workflow_templates: [web-research-risk, security-audit-evidence-gate, authorized-red-team-validation]
    team_templates: [web-research-team, audit-security-team]
    policy_rules: [contains, risk_at_least, ref_truthy, expression]
    required_env: [GOFLOW_API_KEY]
    recommended_workflow: web-research-risk
    recommended_agent: web-security-researcher
    examples:
      - title: Review a target URL
        description: Fetch reachable assets and produce evidence-backed findings.
        request: Review https://example.com for client-side security risks within authorized scope.
        workflow: web-research-risk
        agent: web-security-researcher
    vertical_pack:
      domain: web-security
      maturity: production-ready
      summary: Collects authorized source and browser-rendered web evidence, classifies client-side risk, and reports defensive findings with approval gates.
      supported_tasks: [authorized web target intake, page and asset collection, browser DOM and form evidence collection, browser probe surface enumeration and approved GET canary validation, client-side XSS and security signal review, authorized red-team attack-path validation, non-destructive PoC and canary verification planning, evidence-backed remediation report]
      required_inputs: [target URL, authorized scope confirmation, allowed hosts, desired evidence depth, active verification approval status, allowed actions and payload constraints for red-team validation]
      tool_boundaries:
        - web_tools/browser_snapshot requires authorized_scope=true and allowed_hosts.
        - web_tools/browser_probe_points requires authorized_scope=true and allowed_hosts, and only runs active GET canary probes when active_probe_approved=true.
        - Browser automation returns compact DOM, form, link, script, signal, screenshot hash, and path summaries instead of full raw evidence by default.
        - Active XSS or SQLi-style probing must be approval-gated, non-destructive, rate-limited, and scoped.
        - Authorized red-team validation uses non-destructive canary evidence and stops when an action exceeds scope.
      safety_gates:
        - Reject browser collection without explicit authorized scope.
        - Require host allowlist before browser automation.
        - Route active probing requests through operator approval and evidence capture.
        - Require written authorization, allowed actions, rate limits, and exclusions before offensive validation.
      quality_gates:
        - Requires target scope.
        - Requires collected source or browser evidence.
        - Requires confirmed vs hypothetical finding separation.
        - Requires remediation and residual uncertainty.
      evidence_artifacts: [target scope, page asset inventory, browser snapshot summary, browser probe-point summary, security signal list, risk report, red-team validation plan, red-team validation evidence, blue-team handoff]
      presentation_guidance:
        - Show target URL, allowed hosts, authorization checkbox, evidence status, risk level, and final report.
        - Show whether red-team validation is approved, blocked, or complete.
        - Show tool allowlists, browser evidence refs, context budgets, approval gates, route conditions, and raw workflow graph.
        - Show authorization boundary, allowed actions, blocked actions, canary evidence, and red/blue handoff refs.
      token_strategy:
        - Keep browser outputs compact with DOM hashes and previews.
        - Store screenshots as artifact paths and hashes instead of injecting image bytes.
        - Pass evidence summaries and artifact refs to audit/report stages.
      model_routes:
        strong: [scope and risk arbitration, active verification decision, red-team validation boundary review, final remediation synthesis]
        worker: [asset collection, browser snapshot collection, probe surface enumeration, authorized canary validation, client-side pattern review]
        verifier: [evidence gate review, finding confidence audit]
    metadata:
      preset: web-security
      recommended_team: web-research-team
      primary_skill: web-vulnerability-research

  - name: security-research
    default_kit_name: security-research-kit
    routing:
      version: 1
      match_terms: [安全评估, 漏洞误报复核, 漏洞扫描, 无损漏洞验证, 安全证据评估, 渗透测试, 漏扫, authorized assessment, vulnerability review, penetration test]
      entry_workflow: security-assessment
      required_tools: [file_tools/read_file]
    title: Security Research Kit
    description: Plan authorized security reviews, collect evidence, classify risk, and prepare defensive reports.
    category: security
    tags: [security, audit, evidence, red-team]
    providers: [primary]
    agents: [planner, auditor, security-researcher, web-security-researcher, binary-analyst]
    skills: [execution-plan, vulnerability-research, web-vulnerability-research, authorized-red-team-validation, binary-vulnerability-research, reverse-engineering, code-audit, security-assessment, security-evidence-review, event-notification]
    tools: [file_tools/read_file, file_tools/search_files, web_tools/web_search, web_tools/fetch_url, web_tools/fetch_page_assets, web_tools/browser_snapshot, web_tools/browser_probe_points, python_notes/binary_file_info, python_notes/binary_strings, python_notes/hex_preview, python_notes/binary_format_summary, python_notes/binary_entropy_map, python_notes/binary_symbol_hints, python_notes/binary_extract_window, python_notes/redaction_check, notification_tools/publish_event]
    workflows: [skill-chain, security-assessment]
    workflow_templates: [web-research-risk, security-audit-evidence-gate, authorized-red-team-validation, binary-triage]
    team_templates: [audit-security-team, web-research-team, binary-triage-team]
    policy_rules: [contains, risk_at_least, team_approval_gate, expression]
    recommended_workflow: security-assessment
    recommended_agent: security-researcher
    examples:
      - title: Authorized review
        description: Create a scoped evidence-backed security review.
        request: Create an authorized security review plan and identify evidence requirements.
        workflow: skill-chain
        agent: security-researcher
    vertical_pack:
      domain: security-research
      maturity: production-ready
      summary: Plans authorized security reviews, collects evidence across code, web, binary, and configuration surfaces, arbitrates exploitability, blocks disallowed actions, and routes findings through red-team, blue-team, risk, and quality gates.
      supported_tasks: [authorized security review planning, evidence collection, vulnerability classification, authorized red-team validation, attack-path and exploitability validation planning, disclosure-safe security reporting, remediation planning, cross-domain security handoff]
      required_inputs: [authorized scope, target type, target files or URL, allowed actions, red-team authorization, exclusions and rate limits, reporting expectations]
      tool_boundaries:
        - Use read-only evidence collection before active verification.
        - Web browser automation requires allowed hosts and authorized scope; active web canary probes require explicit approval.
        - Offensive validation must stay non-destructive, scoped, rate-limited, and evidence-oriented.
        - Binary analysis remains static and uses format, entropy, symbol, and bounded artifact helpers unless a separate sandboxed execution tool is added.
        - Redaction checks must run before customer-visible or disclosure-safe reporting when evidence may contain secrets.
      safety_gates:
        - Require scope confirmation.
        - Require approval for active verification or exec-capable tools.
        - Block unsanctioned exploitation, credential attacks, persistence, destructive changes, denial of service, and lateral movement.
        - Separate confirmed vulnerabilities from hypotheses.
        - Preserve authorization blockers, missing evidence, and weak exploitability confidence as visible workflow diagnostics.
      quality_gates:
        - Requires evidence-backed severity.
        - Requires exploitability prerequisites.
        - Requires remediation and follow-up tests.
        - Requires disclosure-safe wording and red/blue handoff evidence before final reporting.
      evidence_artifacts: [scope note, evidence inventory, finding list, authorized red-team validation plan, red-team evidence and blocked-action log, risk decision, disclosure-safe report, remediation report]
      presentation_guidance:
        - Show scope, target type, allowed actions, evidence status, and risk summary.
        - Show whether offensive validation is authorized, blocked, or complete.
        - Show tool allowlists, approval decisions, evidence refs, severity policy, and route diagnostics.
        - Show red-team scope, exclusions, allowed payload classes, rate limits, and blue-team handoff refs.
        - Show authorization blockers, disallowed actions, weak evidence, unresolved exploitability, and disclosure-safe report checks.
      token_strategy:
        - Route each surface to a bounded specialist workflow.
        - Pass concise evidence summaries to the final risk report.
      model_routes:
        strong: [scope triage, exploitability arbitration, red-team authorization boundary review, final report synthesis]
        worker: [code evidence collection, web evidence collection, authorized non-destructive validation, static binary triage]
        verifier: [severity and evidence review]
    metadata:
