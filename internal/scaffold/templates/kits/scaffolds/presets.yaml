      match_terms: [查询最新文档, 查询官方文档, 查找最新资料, 互联网资料, 最新技术资料, 查最新版本, latest documentation, official documentation, internet research]
      entry_workflow: parallel-research-review
      required_tools: [web_tools/web_search, web_tools/research_snapshot]
    title: 互联网资料研究资源包
    description: 搜索、快照、核验并交付带来源映射的互联网研究报告和结构化数据。
