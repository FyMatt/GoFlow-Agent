presets:
  - name: multi-domain-agent
    default_kit_name: multi-domain-agent-kit
    title: Multi-Domain Agent Starter Kit
    description: One starter kit that routes mixed user requests to linked software, security, documentation, operations, support, and platform teams.
    category: starter
    tags: [starter, multi-domain, workflow, team, quality]
    providers: [primary]
    agents: [chat, planner, fixer, auditor, software-engineer, security-researcher, web-security-researcher, binary-analyst, documentation-specialist, operations-specialist, support-specialist, framework-extension-architect]
    skills: [execution-plan, code-writing, code-audit, vulnerability-research, web-vulnerability-research, binary-vulnerability-research, reverse-engineering]
    tools: [file_tools/read_file, file_tools/search_files, file_tools/write_file, web_tools/web_search, web_tools/fetch_url, web_tools/fetch_page_assets, python_notes/binary_file_info, python_notes/binary_strings, python_notes/hex_preview]
    workflows: [plan-fix-audit, skill-chain]
    workflow_templates: [multi-domain-intake-router, task-decomposition-plan, plan-fix-audit, software-quality-gate, software-team-review-gate, web-research-risk, security-audit-evidence-gate, binary-triage, docs-review-publish, operations-runbook, customer-support-triage, agent-framework-extension]
    team_templates: [software-task-team, audit-security-team, web-research-team, binary-triage-team, documentation-team, operations-runbook-team, customer-support-team, framework-extension-team]
    policy_rules: [expression, contains, risk_at_least, ref_truthy, team_approval_gate]
    required_env: [GOFLOW_API_KEY]
    recommended_workflow: multi-domain-intake-router
    recommended_agent: chat
    examples:
      - title: Route a mixed request
        description: Collect context, route to the right domain team, and produce a quality-gated handoff.
        request: Help me decide how to handle this project request and route it to the right workflow.
        workflow: multi-domain-intake-router
        agent: chat
    metadata:
      preset: multi-domain-agent
      recommended_team: framework-extension-team
      primary_skill: execution-plan

