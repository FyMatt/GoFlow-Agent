<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地智能体工作流平台</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand-mark.svg">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("goflow.theme");
        var theme = stored === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    }());
  </script>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/styles-workbench.css">
</head>
<body>
  <a class="skip-link" href="#mainContent" data-i18n="common.skipToMain">跳到主要内容</a>
  <div class="shell" data-app-shell>
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/assets/brand-mark.svg" alt="" width="32" height="32">
        <div class="brand-copy">
          <strong>GoFlow</strong>
          <span data-i18n="brand.subtitle">本地智能体工作流平台</span>
        </div>
        <button id="sidebarToggle" class="ghost-button sidebar-toggle" type="button" aria-label="收起侧栏" title="收起侧栏">
          <span class="sidebar-toggle-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <path d="M9 3v18"></path>
            </svg>
          </span>
        </button>
      </div>

      <div class="nav-group nav-primary" data-primary-nav>
        <nav class="nav" aria-label="主导航" data-i18n-aria-label="nav.sections.primary">
          <button data-view="playground" data-label-key="nav.playground" data-icon="playground" class="active">任务</button>
          <button data-view="workflows" data-label-key="nav.workflows" data-icon="workflows">工作流</button>
          <button data-view="catalog" data-label-key="nav.catalog" data-icon="catalog">资源</button>
          <button data-view="usage" data-label-key="nav.usage" data-icon="usage">用量</button>
          <button data-view="settings" data-label-key="nav.settings" data-icon="settings">设置</button>
        </nav>
      </div>

    </aside>

    <main id="mainContent" class="main" tabindex="-1">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow" id="sectionEyebrow">构建可复用流程</p>
          <h1 id="sectionTitle">工作流</h1>
        </div>
      </header>
      <section id="app" class="view"></section>
    </main>
  </div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
