# Loaded automatically from configs/mcp_servers/*.yaml.
mcp_servers:
  - name: office_tools
    command: go
    args:
      - run
      - ./mcp_servers/office_tools
    enabled: true
    optional: true
    timeout: 150s
    workdir: .
    env_allowlist: [PATH, HOME, USERPROFILE, LOCALAPPDATA, APPDATA, PROGRAMFILES, PROGRAMFILES(X86), TMP, TEMP, GOPATH, GOCACHE, GOMODCACHE, GOFLOW_WORKSPACE_ROOT]
    isolation: auto
    restart_limit: 2
    cooldown: 10s
    max_concurrent_calls: 1
    allowed_commands:
      - go
      - powershell.exe
    max_request_bytes: 1048576
    max_response_bytes: 4194304
