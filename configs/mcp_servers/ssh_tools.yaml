# Loaded automatically from configs/mcp_servers/*.yaml.
mcp_servers:
  - name: ssh_tools
    target_scope: host
    command: go
    args:
      - run
      - ./mcp_servers/ssh_tools
    enabled: true
    optional: true
    timeout: 150s
    workdir: .
    env_allowlist: [PATH, HOME, USERPROFILE, USERNAME, USERDOMAIN, SystemRoot, ProgramData, ProgramFiles, LOCALAPPDATA, TMP, TEMP, GOFLOW_DATA_ROOT, GOFLOW_SSH_CMD, GOFLOW_SSH_KEYSCAN_CMD]
    isolation: auto
    restart_limit: 3
    cooldown: 10s
    max_concurrent_calls: 2
    allowed_commands:
      - go
    max_request_bytes: 65536
    max_response_bytes: 2097152
