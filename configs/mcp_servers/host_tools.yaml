# Loaded automatically from configs/mcp_servers/*.yaml.
mcp_servers:
  - name: host_tools
    target_scope: host
    command: go
    args:
      - run
      - ./mcp_servers/host_tools
    enabled: true
    optional: true
    timeout: 30s
    workdir: .
    env_allowlist: [PATH, HOME, USERPROFILE, SystemRoot, ProgramData, LOCALAPPDATA, TMP, TEMP, GOPATH, GOCACHE, GOMODCACHE, GOFLOW_TARGET_ID, GOFLOW_HOST_LOG_ROOTS, GOFLOW_HOST_MANAGED_CONFIG_ROOTS, GOFLOW_HOST_CHANGE_BACKUP_ROOT]
    isolation: auto
    restart_limit: 3
    cooldown: 10s
    max_concurrent_calls: 1
    allowed_commands:
      - go
    max_request_bytes: 65536
    max_response_bytes: 2097152
