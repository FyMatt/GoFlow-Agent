# Optional generic event connector. Every publish_event uses normal network approval,
# including the default local collector. No external channel is shipped or created.
mcp_servers:
  - name: notification_tools
    command: go
    args: [run, ./mcp_servers/notification_tools]
    enabled: true
    optional: true
    timeout: 15s
    workdir: ./
    env_allowlist: [PATH, HOME, USERPROFILE, SystemRoot, TMP, TEMP, GOPATH, GOCACHE, GOMODCACHE, GOFLOW_DATA_ROOT, GOFLOW_NETWORK_DISABLED]
    isolation: auto
    restart_limit: 3
    cooldown: 10s
    max_concurrent_calls: 1
    allowed_commands: [go]
    max_request_bytes: 65536
    max_response_bytes: 65536
