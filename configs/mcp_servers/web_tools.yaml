# Loaded automatically from configs/mcp_servers/*.yaml.
mcp_servers:
  - name: web_tools
    command: go
    args:
      - run
      - ./mcp_servers/web_tools
    enabled: true
    optional: true
    timeout: 30s
    workdir: .
    env_allowlist: [PATH, HOME, USERPROFILE, LOCALAPPDATA, ProgramFiles, "ProgramFiles(x86)", TMP, TEMP, GOPATH, GOCACHE, GOMODCACHE, GOFLOW_BROWSER_PATH, GOFLOW_RESEARCH_CACHE_DIR, GOFLOW_RESEARCH_ALLOW_LOCAL, GOFLOW_WORKSPACE_ROOT]
    isolation: auto
    restart_limit: 3
    cooldown: 10s
    max_concurrent_calls: 1
    allowed_commands:
      - go
    max_request_bytes: 65536
    max_response_bytes: 2097152
