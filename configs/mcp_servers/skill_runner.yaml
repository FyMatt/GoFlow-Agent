# Loaded automatically from configs/mcp_servers/*.yaml.
mcp_servers:
  - name: skill_runner
    command: go
    args:
      - run
      - ./mcp_servers/skill_runner
      - --skills-dir
      - ./skills
    enabled: true
    timeout: 2m
    workdir: .
    env_allowlist:
      - PATH
      - HOME
      - USERPROFILE
      - LOCALAPPDATA
      - TMP
      - TEMP
      - GOFLOW_SKILL_PYTHON_CMD
      - GOFLOW_SKILL_NODE_CMD
      - GOFLOW_SKILL_BASH_CMD
      - GOFLOW_SKILL_POWERSHELL_CMD
      - GOFLOW_SKILL_GO_CMD
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_commands:
      - go
    max_request_bytes: 65536
    max_response_bytes: 2097152
