# Loaded automatically from configs/mcp_servers/*.yaml.
mcp_servers:
  - name: command_tools
    command: go
    args:
      - run
      - ./mcp_servers/command_tools
    enabled: true
    timeout: 5m
    workdir: .
    env_allowlist:
      - PATH
      - HOME
      - USERPROFILE
      - LOCALAPPDATA
      - APPDATA
      - TMP
      - TEMP
      - GOPATH
      - GOCACHE
      - GOMODCACHE
      - GOENV
      - GOFLAGS
      - CGO_ENABLED
      - CC
      - CXX
      - NODE_OPTIONS
      - NPM_CONFIG_CACHE
      - PNPM_HOME
      - CI
    isolation: auto
    restart_limit: 3
    cooldown: 10s
    max_concurrent_calls: 1
    allowed_commands:
      - go
      - node
    max_request_bytes: 65536
    max_response_bytes: 524288
