agent:
  name: GoFlow Agent
  max_iterations: 8
  timeout: 2m

default_agent: chat

mcp_servers:
  - name: file_tools
    command: /app/bin/file_tools
    args: []
    enabled: true
    timeout: 30s
    workdir: /app
    env_allowlist: [PATH, HOME, TMP, TEMP]
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_command_paths:
      - /app/bin
    max_request_bytes: 65536
    max_response_bytes: 2097152

  - name: python_notes
    command: python3
    args:
      - /app/mcp_servers/python_notes.py
    enabled: true
    timeout: 30s
    workdir: /app
    env_allowlist: [PATH, HOME, TMP, TEMP]
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_commands:
      - python3
    max_request_bytes: 65536
    max_response_bytes: 2097152

  - name: skill_runner
    command: /app/bin/skill_runner
    args:
      - --skills-dir
      - /app/skills
    enabled: true
    timeout: 2m
    workdir: /app
    env_allowlist: [PATH, HOME, TMP, TEMP, GOFLOW_SKILL_PYTHON_CMD, GOFLOW_SKILL_NODE_CMD, GOFLOW_SKILL_BASH_CMD, GOFLOW_SKILL_POWERSHELL_CMD, GOFLOW_SKILL_GO_CMD]
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_command_paths:
      - /app/bin
    max_request_bytes: 65536
    max_response_bytes: 2097152

  - name: web_tools
    command: /app/bin/web_tools
    args: []
    enabled: true
    timeout: 30s
    workdir: /app
    env_allowlist: [PATH, HOME, TMP, TEMP, HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_command_paths:
      - /app/bin
    max_request_bytes: 65536
    max_response_bytes: 2097152

skill:
  directory: /app/skills
  match_threshold: 1
  hot_reload: false

audit:
  enabled: true
  redact_content: false
  show_trace_in_cli: false

verifier:
  enabled: true
  agent: auditor
  # Optional: route the verifier pass to a cheaper configured provider/model.
  # provider: backup
  # model: ${GOFLOW_VERIFIER_MODEL}
  modes: [fix, audit]
  max_tokens: 768

cost_control:
  router:
    enabled: false
    # Optional: classify otherwise-unmatched requests with a cheaper model.
    # provider: backup
    # model: ${GOFLOW_ROUTER_MODEL}
    max_tokens: 96
    temperature: 0
  summarizer:
    enabled: false
    # Optional: summarize exhausted tool loops with a cheaper model.
    # provider: backup
    # model: ${GOFLOW_SUMMARIZER_MODEL}
    max_tokens: 512
    temperature: 0

session:
  max_history: 8
  persist_path: /workspace/.goflow/session.json

log:
  level: info
  format: text
