agent:
  name: GoFlow Agent
  max_iterations: 8
  timeout: 2m

default_agent: chat

providers:
  primary:
    provider: openai-compatible
    base_url: ${GOFLOW_BASE_URL}
    api_key: ${GOFLOW_API_KEY}
    model: ${GOFLOW_MODEL}
    fallback_provider: backup
    timeout: 60s
    temperature: 0.2
    max_tokens: 2048
    retry_count: 2
    retry_backoff: 2s

  backup:
    provider: openai-compatible
    base_url: ${GOFLOW_BACKUP_BASE_URL}
    api_key: ${GOFLOW_BACKUP_API_KEY}
    model: ${GOFLOW_BACKUP_MODEL}
    timeout: 60s
    temperature: 0.2
    max_tokens: 2048
    retry_count: 1
    retry_backoff: 1s

agents:
  chat:
    name: Chat
    description: Handles ordinary user requests and can route into planner/fixer/auditor flows when needed.
    provider: primary
    mode: chat
    tool_policy: confirm
    allowed_tool_kinds: [read, network]
    max_iterations: 8
  planner:
    name: Planner
    description: Produces scoped implementation plans before changes are made.
    provider: primary
    mode: plan
    tool_policy: confirm
    allowed_tool_kinds: [read, network]
    max_iterations: 6
  fixer:
    name: Fixer
    description: Makes minimal code changes based on an approved plan.
    provider: primary
    mode: fix
    tool_policy: confirm
    allowed_tool_kinds: [read, write, exec, network]
    max_iterations: 8
  auditor:
    name: Auditor
    description: Reviews completed work for regressions, risks, and follow-ups.
    provider: primary
    mode: audit
    tool_policy: confirm
    allowed_tool_kinds: [read, exec, network]
    max_iterations: 6

mcp_servers:
  - name: file_tools
    command: /app/bin/file_tools
    args: []
    enabled: true
    timeout: 30s
    workdir: /app
    env_allowlist: [PATH, HOME, TMP, TEMP]
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_command_paths:
      - /app/bin
    max_request_bytes: 65536
    max_response_bytes: 2097152

  - name: python_notes
    command: python3
    args:
      - /app/mcp_servers/python_notes.py
    enabled: true
    timeout: 30s
    workdir: /app
    env_allowlist: [PATH, HOME, TMP, TEMP]
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_commands:
      - python3
    max_request_bytes: 65536
    max_response_bytes: 2097152

  - name: web_tools
    command: /app/bin/web_tools
    args: []
    enabled: true
    timeout: 30s
    workdir: /app
    env_allowlist: [PATH, HOME, TMP, TEMP, HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    isolation: process_group
    restart_limit: 3
    cooldown: 10s
    allowed_command_paths:
      - /app/bin
    max_request_bytes: 65536
    max_response_bytes: 2097152

skill:
  directory: /app/skills
  match_threshold: 1
  hot_reload: false

audit:
  enabled: true
  redact_content: false
  show_trace_in_cli: false

verifier:
  enabled: true
  agent: auditor
  modes: [fix, audit]
  max_tokens: 768

session:
  max_history: 8
  persist_path: /workspace/.goflow/session.json

log:
  level: info
  format: text

