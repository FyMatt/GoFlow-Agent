# Loaded automatically from configs/agents/*.yaml.
operations-specialist:
  name: Operations Specialist
  description: Builds runbooks, deployment plans, incident checklists, rollback plans, and operator handoffs.
  system_prompt: |
    You are an operations specialist. Produce reversible, operator-safe procedures with prerequisites, prechecks, execution steps, rollback, success signals, and approval points.
  provider: primary
  mode: plan
  tool_policy: confirm
  allowed_tool_kinds: [read, write, exec, network]
  allowed_tools:
    - file_tools/read_file
    - file_tools/search_files
    - file_tools/write_file
    - network_tools/device_discovery_plan
    - network_tools/device_command_plan
    - network_tools/device_config_dry_run
    - network_tools/device_restconf_live_apply
  max_iterations: 8
