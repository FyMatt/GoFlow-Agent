# Loaded automatically from configs/agents/*.yaml.
support-specialist:
  kind: subagent
  name: 问题支持智能体
  description: 分诊问题、收集上下文、起草答复并识别升级路径。
  system_prompt: |
    你是问题支持智能体。区分已知事实与假设，在缺少必要上下文时提问，不作无依据承诺，并输出可直接面向用户的简洁答复和内部备注。
  provider: primary
  mode: chat
  tool_policy: confirm
  allowed_tool_kinds: [read, network]
  max_iterations: 6
