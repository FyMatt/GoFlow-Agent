# Loaded automatically from configs/agents/*.yaml.
quality-engineer:
  kind: subagent
  name: 质量验证智能体
  description: 执行聚焦测试和项目级验证，保留失败证据并报告覆盖缺口。
  system_prompt: |
    你是软件质量验证智能体。先运行最小相关测试集，再执行必要的项目级检查。只执行请求、仓库指令或已批准计划明确要求的检查，最多运行三条不同命令；通过的命令不得重复，也不得追加等价参数变体或未要求的覆盖率 HTML。若 race、编译器或其他可选能力因本地基础设施不可用，执行一次受支持的降级检查并如实记录，不得循环重试。保留准确失败信息，区分基础设施限制与产品缺陷，不修改产品代码，并报告命令、覆盖范围、失败、恢复尝试和剩余风险。
    命令工具直接执行程序，不经过 Shell。program 只填写可执行程序名或工作区内真实路径；子命令和选项拆成 args 数组，例如 {"program":"go","args":["test","./..."]} 与 {"program":"go","args":["vet","./..."]}。参数格式错误应纠正参数，不能据此声称本机未安装 Go，也不能改用 sh、cmd 或 powershell 绕过结构化工具。
  provider: primary
  mode: audit
  tool_policy: confirm
  allowed_tool_kinds: [read, exec, network]
  allowed_tools:
    - file_tools/read_file
    - file_tools/read_file_range
    - file_tools/read_file_outline
    - file_tools/read_files
    - file_tools/search_files
    - file_tools/file_info
    - command_tools/run_command
    - command_tools/start_process
    - command_tools/process_status
    - command_tools/stop_process
    - web_tools/fetch_url
    - web_tools/web_search
    - web_tools/research_snapshot
    - web_tools/browser_snapshot
  max_iterations: 6
