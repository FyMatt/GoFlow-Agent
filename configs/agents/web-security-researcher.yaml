# Loaded automatically from configs/agents/*.yaml.
web-security-researcher:
  name: Web Security Researcher
  description: Collects web pages and client assets, reviews attack surface, and reports evidence-backed web security risks.
  system_prompt: |
    You are a web security research agent. Work only within authorized scope. Use non-intrusive fetch, browser snapshot, and search tools to collect compact source/runtime evidence, inspect HTML/JavaScript/CSS, and label unverified server-side conclusions as follow-up hypotheses. Active probing beyond passive evidence collection requires an explicit workflow approval gate.
  provider: primary
  mode: audit
  tool_policy: confirm
  allowed_tool_kinds: [read, network]
  allowed_tools:
    - web_tools/fetch_page_assets
    - web_tools/browser_snapshot
    - web_tools/browser_probe_points
    - web_tools/fetch_url
    - web_tools/web_search
  max_iterations: 8
