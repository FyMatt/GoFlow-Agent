kind: goflow.workflow_template_resource
version: 2
min_supported_version: 1
name: web-research-risk-copy
title: Web Research -> Risk Audit Copy
description: Collect authorized web source/runtime evidence, audit it, branch on findings, and produce a scoped risk report.
category: security
tags:
    - web
    - security
    - branching
    - quality_gate
    - evidence
source: custom
custom: true
stages: 9
graph:
    name: web-research-risk-copy
    description: Research a web target and route findings through a scoped risk branch.
    stages:
        - name: start
          node_type: start
          agent: ""
          skill: ""
          next:
            - collect
          position:
            x: 60
            "y": 200
        - name: collect
          node_type: agent
          agent: web-security-researcher
          skill: web-vulnerability-research
          params:
            output_contract: Emit sections named Evidence Summary, Target Scope, Browser Evidence, Findings, Source Confidence, Limitations, and Recommended Verification.
            evidence_rule: Keep evidence tied to the operator-provided target, require authorized_scope=true and allowed_hosts before browser evidence collection, and use browser_probe_points only for scoped probe surface enumeration unless active_probe_approved=true.
            authorization_boundary: Only run on systems the operator owns or is explicitly authorized to test. Do not probe hosts outside allowed_hosts.
            allowed_tools: web_tools/fetch_page_assets,web_tools/browser_snapshot,web_tools/browser_probe_points,web_tools/fetch_url,web_tools/web_search
          outputs:
            evidence: result.output
            findings: result.findings
            summary: result.summary
          artifacts:
            - name: web-research-evidence
              kind: evidence
              title: Web research evidence
              ref: result.output
              summary: Evidence summary, target scope, browser/source observations, confidence, limitations, and recommended verification.
          acceptance_criteria:
            - name: has-evidence-summary
              ref: result.output
              contains: Evidence Summary
              expected: collection summarizes the evidence
            - name: has-target-scope
              ref: result.output
              contains: Target Scope
              expected: collection states the authorized target scope
          next:
            - audit
          position:
            x: 300
            "y": 170
        - name: audit
          node_type: skill
          agent: auditor
          skill: code-audit
          params:
            output_contract: Emit sections named Audit Decision, Findings, Vulnerability Assessment, Evidence Gaps, Risk Level, and Recommendation.
            review_scope: Classify risk using the collected evidence and call out uncertainty.
          input:
            evidence: stages.collect.outputs.evidence
          outputs:
            audit: result.output
            findings: result.findings
            summary: result.summary
          artifacts:
            - name: web-risk-audit
              kind: report
              title: Web risk audit
              ref: result.output
              summary: Audit decision, findings, vulnerability assessment, evidence gaps, risk level, and recommendation.
          acceptance_criteria:
            - name: has-audit-decision
              ref: result.output
              contains: Audit Decision
              expected: audit states whether risk is present
            - name: has-risk-level
              ref: result.output
              contains: Risk Level
              expected: audit classifies risk level
          next:
            - quality
          position:
            x: 580
            "y": 170
        - name: quality
          node_type: quality_gate
          agent: ""
          skill: ""
          params:
            stages: collect,audit
            min_score: "80"
            reason: web risk evidence is missing target scope, audit decision, risk classification, or browser/source evidence boundaries
            require_acceptance: "true"
            require_evidence: "true"
            require_verification: "true"
            allow_unknown: "false"
          routes:
            pass: has-risk
            warning: verify
            fail: report-risk
          position:
            x: 850
            "y": 200
        - name: has-risk
          node_type: condition
          agent: ""
          skill: ""
          condition: contains(stages.audit.outputs.audit, "vulnerability")
          routes:
            "false": report-clean
            "true": verify
          position:
            x: 1120
            "y": 200
        - name: verify
          node_type: checkpoint
          agent: ""
          skill: ""
          params:
            prompt: Review the evidence and authorization boundary before running verification.
          next:
            - report-risk
          position:
            x: 1390
            "y": 120
        - name: report-risk
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            output_contract: Emit sections named Risk Report, Evidence, Vulnerability Assessment, Quality Decision, Operator Actions, and Next Steps.
            purpose: Produce a risk-positive or evidence-insufficient user report.
          input:
            audit: stages.audit.outputs.audit
            evidence: stages.collect.outputs.evidence
            quality_status: stages.quality.outputs.quality_status
          outputs:
            report: result.output
            summary: result.summary
          artifacts:
            - name: web-risk-report
              kind: report
              title: Web risk report
              ref: result.output
              summary: Risk report, evidence, vulnerability assessment, quality decision, operator actions, and next steps.
          acceptance_criteria:
            - name: has-risk-report
              ref: result.output
              contains: Risk Report
              expected: report summarizes risk-positive or uncertain findings
            - name: has-next-steps
              ref: result.output
              contains: Next Steps
              expected: report gives next steps
          next:
            - end
          position:
            x: 1660
            "y": 120
        - name: report-clean
          node_type: skill
          agent: planner
          skill: execution-plan
          params:
            output_contract: Emit sections named Clean Report, Evidence, Why No Risk Was Routed, Residual Uncertainty, and Next Steps.
            purpose: Produce a clean-path user report that still documents evidence and uncertainty.
          input:
            audit: stages.audit.outputs.audit
            evidence: stages.collect.outputs.evidence
            quality_status: stages.quality.outputs.quality_status
          outputs:
            report: result.output
            summary: result.summary
          artifacts:
            - name: web-clean-report
              kind: report
              title: Web clean report
              ref: result.output
              summary: Clean-path evidence, no-risk rationale, residual uncertainty, and next steps.
          acceptance_criteria:
            - name: has-clean-report
              ref: result.output
              contains: Clean Report
              expected: clean report explains why risk was not routed
            - name: has-residual-uncertainty
              ref: result.output
              contains: Residual Uncertainty
              expected: clean report states residual uncertainty
          next:
            - end
          position:
            x: 1390
            "y": 300
        - name: end
          node_type: end
          agent: ""
          skill: ""
          position:
            x: 1940
            "y": 200
