name: plan-fix-audit
description: Plan a requested change, implement approved work, verify the result, pass an evidence-backed quality gate, and produce an audit-ready output.
stages:
    - name: start
      node_type: start
      agent: ""
      skill: ""
      next:
        - intake
      position:
        x: 180
        "y": 289
    - name: intake
      node_type: agent
      agent: planner
      skill: execution-plan
      params:
        output_contract: Emit sections named Goal, Affected Files, Constraints, Acceptance Checks, Risks, and Open Questions.
        purpose: Clarify the task before planning edits.
        risk_scope: Identify workspace, dependency, test, approval, and rollback risks before planning edits.
      outputs:
        goal: result.summary
        intake_report: result.output
        risks: result.findings
      artifacts:
        - name: intake-report
          kind: report
          title: Intake report
          ref: result.output
          summary: Clarified objective, affected files, constraints, acceptance checks, risks, and open questions.
      acceptance_criteria:
        - name: has-goal
          ref: result.output
          contains: Goal
          expected: intake names the requested outcome
        - name: has-acceptance-checks
          ref: result.output
          contains: Acceptance Checks
          expected: intake defines how success will be checked
        - name: has-risks
          ref: result.output
          contains: Risks
          expected: intake records implementation and approval risks
      next:
        - plan
      position:
        x: 640
        "y": 271
    - name: plan
      node_type: skill
      agent: planner
      skill: execution-plan
      params:
        output_contract: Emit sections named Implementation Steps, Target Files, Verification Commands, Rollback Notes, and Handoff.
        purpose: Produce an implementation plan that the fixer can execute without rediscovering the task.
      input:
        intake: stages.intake.outputs.intake_report
        request: workflow.input
      outputs:
        plan: result.output
        summary: result.summary
      artifacts:
        - name: implementation-plan
          kind: report
          title: Implementation plan
          ref: result.output
          summary: Ordered steps, target files, verification commands, rollback notes, and handoff guidance.
      acceptance_criteria:
        - name: has-steps
          ref: result.output
          contains: Implementation Steps
          expected: plan contains ordered implementation steps
        - name: has-target-files
          ref: result.output
          contains: Target Files
          expected: plan names likely files or areas
        - name: has-verification
          ref: result.output
          contains: Verification Commands
          expected: plan declares verification commands or checks
      context:
        include:
            - memory.project
            - previous.summary
            - stages.intake.outputs.intake_report
        exclude:
            - raw_tool_logs
            - large_file_contents
        max_tokens: 3500
        retrieval:
            enabled: true
            query: '{{input.goal}}'
      next:
        - implement
      position:
        x: 1160
        "y": 271
    - name: implement
      node_type: agent
      agent: fixer
      skill: code-writing
      params:
        edit_policy: Apply the approved plan with focused code changes, preserve user edits, and keep unrelated files untouched.
        output_contract: Emit sections named Change Summary, Files Changed, Verification Notes, and Residual Risk.
      input:
        intake: stages.intake.outputs.intake_report
        plan: stages.plan.outputs.plan
      outputs:
        changes: result.changes
        implementation_report: result.output
        summary: result.summary
      artifacts:
        - name: implementation-report
          kind: report
          title: Implementation report
          ref: result.output
          summary: Files changed, verification notes, and residual implementation risk.
      acceptance_criteria:
        - name: has-change-summary
          ref: result.output
          contains: Change Summary
          expected: implementation reports what changed
        - name: has-files-changed
          ref: result.output
          contains: Files Changed
          expected: implementation lists changed files or explains none
      retry:
        max_attempts: 2
      approval: true
      context:
        include:
            - previous.summary
            - previous.artifacts.implementation-plan
            - stages.plan.outputs.plan
            - files.changed
        exclude:
            - raw_tool_logs
            - unrelated_session_history
        max_tokens: 4200
      next:
        - verify
      position:
        x: 1680
        "y": 271
    - name: verify
      node_type: skill
      agent: auditor
      skill: code-audit
      params:
        evidence: Include exact commands or checks performed. If a command was not run, explain why.
        output_contract: Emit sections named Verification Result, Commands Run, Failures, Coverage, and Residual Risk.
        verification_command: go test ./...
      input:
        changes: stages.implement.outputs.implementation_report
        plan: stages.plan.outputs.plan
      outputs:
        summary: result.summary
        verification: result.output
      artifacts:
        - name: verification-report
          kind: verification
          title: Verification report
          ref: result.output
          summary: Commands, checks, failures, coverage, and residual risk.
      acceptance_criteria:
        - name: verification-result
          ref: result.output
          contains: Verification Result
          expected: verification declares pass, fail, warning, or not-run
        - name: commands-recorded
          ref: result.output
          contains: Commands Run
          expected: verification lists exact commands or explains why none ran
      context:
        include:
            - previous.summary
            - previous.artifacts.implementation-report
            - stages.implement.outputs.implementation_report
        exclude:
            - raw_tool_logs
        max_tokens: 3600
      next:
        - audit
      position:
        x: 2200
        "y": 271
    - name: audit
      node_type: skill
      agent: auditor
      skill: code-audit
      params:
        output_contract: Emit sections named Findings, Severity Order, Missed Requirements, Test Gaps, Safety Notes, and Recommendation.
        severity_order: Prioritize concrete bugs and risks before summaries.
      input:
        implementation: stages.implement.outputs.implementation_report
        plan: stages.plan.outputs.plan
        verification: stages.verify.outputs.verification
      outputs:
        audit: result.output
        findings: result.findings
        summary: result.summary
      artifacts:
        - name: audit-report
          kind: report
          title: Audit report
          ref: result.output
          summary: Severity-ordered findings, missed requirements, safety notes, test gaps, and recommendation.
      acceptance_criteria:
        - name: has-findings
          ref: result.output
          contains: Findings
          expected: audit includes findings or explicitly says none found
        - name: has-recommendation
          ref: result.output
          contains: Recommendation
          expected: audit gives a concrete recommendation
      context:
        include:
            - previous.summary
            - previous.artifacts.verification-report
            - stages.implement.outputs.implementation_report
            - stages.verify.outputs.verification
        exclude:
            - raw_tool_logs
        max_tokens: 4000
      next:
        - quality
      position:
        x: 2720
        "y": 271
    - name: quality
      node_type: quality_gate
      agent: ""
      skill: ""
      params:
        allow_unknown: "false"
        min_score: "80"
        reason: implementation, verification, or audit evidence is missing or below the release bar
        require_acceptance: "true"
        require_evidence: "true"
        require_verification: "true"
        stages: implement,verify,audit
      routes:
        fail: revise
        pass: final-handoff
        warning: operator-review
      position:
        x: 3240
        "y": 271
    - name: operator-review
      node_type: checkpoint
      agent: ""
      skill: ""
      params:
        prompt: The quality gate passed with warnings. Review the plan, implementation, verification, and audit artifacts before final handoff.
      next:
        - final-handoff
      position:
        x: 3760
        "y": 150
    - name: revise
      node_type: skill
      agent: planner
      skill: execution-plan
      params:
        output_contract: Emit sections named Revision Plan, Blocking Issues, Required Evidence, and Next Action.
        purpose: Explain what must change before this workflow can be accepted.
      input:
        audit: stages.audit.outputs.audit
        failures: stages.quality.outputs.failures
        quality_status: stages.quality.outputs.quality_status
        verification: stages.verify.outputs.verification
      outputs:
        revision_plan: result.output
        summary: result.summary
      artifacts:
        - name: revision-plan
          kind: report
          title: Revision plan
          ref: result.output
          summary: Blocking issues, missing evidence, and next action after a failed quality gate.
      next:
        - final-handoff
      position:
        x: 3760
        "y": 392
    - name: final-handoff
      node_type: skill
      agent: planner
      skill: execution-plan
      params:
        output_contract: Emit sections named Final Status, Delivered Changes, Verification Evidence, Audit Summary, Remaining Risks, and Next Steps.
        purpose: Produce a concise user-facing handoff whether the workflow passed, needs operator review, or requires revision.
      input:
        audit: stages.audit.outputs.audit
        implementation: stages.implement.outputs.implementation_report
        plan: stages.plan.outputs.plan
        quality_status: stages.quality.outputs.quality_status
        revision_plan: stages.revise.outputs.revision_plan
        verification: stages.verify.outputs.verification
      outputs:
        final_report: result.output
        summary: result.summary
      artifacts:
        - name: final-handoff-report
          kind: report
          title: Final handoff report
          ref: result.output
          summary: Final status, delivered changes, verification evidence, audit summary, risks, and next steps.
      acceptance_criteria:
        - name: has-final-status
          ref: result.output
          contains: Final Status
          expected: final handoff declares the outcome
        - name: has-verification-evidence
          ref: result.output
          contains: Verification Evidence
          expected: final handoff includes verification evidence or the reason it is missing
        - name: has-next-steps
          ref: result.output
          contains: Next Steps
          expected: final handoff gives concrete next steps
      context:
        include:
            - previous.summary
            - previous.artifacts.audit-report
            - previous.artifacts.verification-report
            - previous.artifacts.revision-plan
            - stages.audit.outputs.audit
            - stages.verify.outputs.verification
            - stages.revise.outputs.revision_plan
            - files.changed
        exclude:
            - raw_tool_logs
            - large_file_contents
        max_tokens: 4200
      next:
        - output
      position:
        x: 4280
        "y": 271
    - name: output
      node_type: end
      agent: ""
      skill: ""
      position:
        x: 4800
        "y": 289
