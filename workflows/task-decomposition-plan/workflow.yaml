name: task-decomposition-plan
description: Pre-flight planning workflow for complex tasks. It produces a normalized workflow graph candidate rather than directly changing project files.
stages:
    - name: start
      node_type: start
      agent: ""
      skill: ""
      next:
        - decompose
      position:
        x: 180
        "y": 779
    - name: decompose
      node_type: agent
      agent: planner
      skill: execution-plan
      params:
        output_contract: Emit sections named Plan Graph Candidate, Phases, Dependencies, Risk Labels, Required Workspace Access, Required Tools, Suggested Agents, Suggested Skills, Expected Artifacts, Acceptance Criteria, Checkpoints, and Failure Modes.
        purpose: Turn the original request into a normalized plan graph candidate before implementation.
        quality_bar: Every executable node must have required inputs, expected outputs, artifacts, retry/failure guidance, and acceptance criteria.
      outputs:
        plan_graph_candidate: result.output
        summary: result.summary
      artifacts:
        - name: plan-graph-candidate
          kind: plan
          title: Plan graph candidate
          ref: result.output
          summary: Normalized candidate workflow plan with phases, dependencies, contracts, risks, and artifacts.
      acceptance_criteria:
        - name: has-phases
          ref: result.output
          contains: Phases
          expected: candidate lists the major phases
        - name: has-acceptance
          ref: result.output
          contains: Acceptance Criteria
          expected: candidate declares acceptance criteria
        - name: has-artifacts
          ref: result.output
          contains: Expected Artifacts
          expected: candidate declares expected artifacts
        - name: has-risks
          ref: result.output
          contains: Risk Labels
          expected: candidate classifies task risk
      next:
        - review-plan
      position:
        x: 732
        "y": 761
    - name: review-plan
      node_type: skill
      agent: auditor
      skill: code-audit
      params:
        output_contract: Emit sections named Review Decision, Risks, Missing Evidence, Required Changes, and Recommendation. Include the word approved only if the candidate is ready to materialize.
        review_scope: Review the candidate for missing dependencies, unsafe tool access, weak acceptance criteria, missing evidence, missing human checkpoints, and unclear handoffs.
      input:
        candidate: stages.decompose.outputs.plan_graph_candidate
      outputs:
        findings: result.findings
        recommendation: result.summary
        review: result.output
      artifacts:
        - name: plan-review
          kind: review
          title: Plan review
          ref: result.output
          summary: Review of candidate graph quality, safety, evidence, and handoff readiness.
      acceptance_criteria:
        - name: review-decision
          ref: result.output
          contains: Review Decision
          expected: review declares whether the candidate is ready
        - name: risk-reviewed
          ref: result.output
          contains: Risks
          expected: review covers safety and quality risks
        - name: recommendation-present
          ref: result.output
          contains: Recommendation
          expected: review gives an actionable recommendation
      next:
        - quality
      position:
        x: 1344
        "y": 761
    - name: quality
      node_type: quality_gate
      agent: ""
      skill: ""
      params:
        min_score: "75"
        reason: task decomposition candidate is missing required contracts, evidence, or review quality
        require_acceptance: "true"
        require_evidence: "true"
        require_verification: "true"
      routes:
        fail: clarify-scope
        pass: materialize-candidate
        warning: operator-review
      position:
        x: 1956
        "y": 761
    - name: operator-review
      node_type: checkpoint
      agent: ""
      skill: ""
      params:
        prompt: The decomposition passed with warnings. Review the candidate and plan-review artifacts before materializing the workflow draft.
      next:
        - materialize-candidate
      position:
        x: 2568
        "y": 623
    - name: materialize-candidate
      node_type: skill
      agent: planner
      skill: execution-plan
      params:
        output_contract: Emit Final Workflow Draft, Node Contracts, Data Flow, Approval Gates, Evidence Plan, and Next Steps. Include a YAML skeleton with name, description, and stages.
        purpose: Produce a final workflow graph draft that can be copied into workflows/<name>/workflow.yaml or saved as a workflow template resource.
      input:
        candidate: stages.decompose.outputs.plan_graph_candidate
        quality: stages.quality.outputs.quality_status
        review: stages.review-plan.outputs.review
      outputs:
        summary: result.summary
        workflow_draft: result.output
      artifacts:
        - name: workflow-draft
          kind: workflow_template
          title: Workflow draft
          ref: result.output
          summary: Materialized workflow graph draft with node contracts and data-flow notes.
      acceptance_criteria:
        - name: draft-has-yaml
          ref: result.output
          contains: stages
          expected: draft includes a workflow YAML skeleton
        - name: draft-has-data-flow
          ref: result.output
          contains: Data Flow
          expected: draft explains how node outputs become downstream inputs
        - name: draft-has-approval-gates
          ref: result.output
          contains: Approval Gates
          expected: draft names human or policy checkpoints
      next:
        - end
      position:
        x: 3180
        "y": 761
    - name: clarify-scope
      node_type: input_gate
      agent: ""
      skill: ""
      params:
        fields_json: '{"fields":[{"name":"scope","type":"textarea","label":"Scope clarification","required":true},{"name":"risk_tolerance","type":"select","label":"Risk tolerance","options":["low","medium","high"],"default":"medium"},{"name":"required_artifacts","type":"textarea","label":"Required artifacts"}]}'
        manual: "true"
        prompt: The decomposition did not meet the quality bar. Provide missing scope, risk tolerance, and required artifacts before retrying.
      outputs:
        required_artifacts: params.required_artifacts
        risk_tolerance: params.risk_tolerance
        scope: params.scope
      next:
        - decompose
      position:
        x: 2568
        "y": 899
    - name: end
      node_type: end
      agent: ""
      skill: ""
      position:
        x: 3792
        "y": 779
