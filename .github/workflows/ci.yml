name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  windows-preflight:
    name: Windows shared preflight
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Shared preflight and Windows archive validation
        shell: pwsh
        env:
          # Shared runners are slower than a desktop; keep the same gates with an
          # explicit 2.5x margin instead of failing on machine variance.
          GOFLOW_V3_PERF_SCALE: "2.5"
        run: |
          python scripts/run_preflight.py --browser-required --release-target windows/amd64 2>&1 | Tee-Object -FilePath preflight.log
          if ($LASTEXITCODE -ne 0) {
            $failures = Select-String -Path preflight.log -Pattern '^FAIL|--- FAIL|^\s+--- FAIL|_test\.go:\d+:|Error:|error:|AssertionError|Traceback|panic:' | ForEach-Object { $_.Line } | Select-Object -Last 60
            $tail = (Get-Content preflight.log -Tail 5)
            $summary = (($failures + $tail) -join '%0A')
            if ($summary.Length -gt 60000) { $summary = $summary.Substring($summary.Length - 60000) }
            Write-Output "::error title=preflight failure::$summary"
            exit 1
          }

  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  windows-release-lifecycle:
    name: Windows final archive lifecycle
    runs-on: windows-latest
    needs: windows-preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build final Windows archive
        run: python scripts/build_release_assets.py --clean --version dev --target windows/amd64
      - name: Generate release metadata
        run: python scripts/generate_sbom.py --version dev --output dist/SBOM.spdx.json --license-output dist/THIRD_PARTY_LICENSES.json --update-checksums
      - name: Validate Windows final archive lifecycle
        run: python scripts/windows_native_acceptance.py --archive dist/goflow-agent_dev_windows_amd64.zip --checksums dist/SHA256SUMS
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-acceptance
          path: .artifacts/windows-native-acceptance/
