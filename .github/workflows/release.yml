name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  archives:
    name: binary archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release archives
        run: python scripts/build_release_assets.py --clean --version "${GITHUB_REF_NAME:-dev}"

      - name: Generate SBOM
        run: python scripts/generate_sbom.py --version "${GITHUB_REF_NAME:-dev}" --output dist/SBOM.spdx.json --update-checksums

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        run: python scripts/sign_release_artifacts.py --dist dist

      - name: Validate release artifacts
        run: python scripts/validate_release_archives.py --dist dist --version "${GITHUB_REF_NAME:-dev}" --require-sbom --require-signatures

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goflow-agent-archives
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "app=${repo}" >> "$GITHUB_OUTPUT"
          echo "mcp_python=${repo}-mcp-python" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Build and optionally push Docker image
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ steps.image.outputs.app }}:${{ github.ref_name }}
            ${{ steps.image.outputs.app }}:latest

      - name: Build and optionally push MCP Python image
        id: build-mcp-python
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp-python/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ steps.image.outputs.mcp_python }}:${{ github.ref_name }}
            ${{ steps.image.outputs.mcp_python }}:latest

      - name: Sign Docker image
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes "${{ steps.image.outputs.app }}@${{ steps.build-app.outputs.digest }}"

      - name: Sign MCP Python image
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes "${{ steps.image.outputs.mcp_python }}@${{ steps.build-mcp-python.outputs.digest }}"
